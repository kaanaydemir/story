  }
}

// ------------------------------------------------------------
// Karo boyama (prosedürel, gece paletinde okunur)
// ------------------------------------------------------------
function paintMap(map, painter) {
  const c = makeCanvas(map.w * TILE, map.h * TILE), g = c.getContext('2d');
  for (let j = 0; j < map.h; j++)
    for (let i = 0; i < map.w; i++) {
      const x = i + map.x0, y = j + map.y0, v = map.t[j * map.w + i];
      painter(g, v, x, y, i * TILE, j * TILE, makeRng((i * 73856093) ^ (j * 19349663) ^ 0x5bd1e995));
    }
  map.img = c;
  return c;
}
function speckle(g, px, py, rr, base, cols, n) {
  g.fillStyle = base; g.fillRect(px, py, TILE, TILE);
  for (let k = 0; k < n; k++) { g.fillStyle = cols[Math.floor(rr() * cols.length)]; g.fillRect(px + Math.floor(rr() * 16), py + Math.floor(rr() * 16), 1, 1); }
}
const GRASS_COLS = ['#3b5340', '#4a6448', '#2e4434', '#58704e', '#6b7c52'];
function paintGrass(g, px, py, rr, dry) {
  speckle(g, px, py, rr, dry ? '#4c5638' : '#3e5640', dry ? ['#5e6640', '#3e4630', '#6e7448'] : GRASS_COLS, 46);
  for (let k = 0; k < 3; k++) { if (rr() < 0.5) continue; const x = px + 2 + Math.floor(rr() * 12), y = py + 2 + Math.floor(rr() * 12); g.fillStyle = '#6f8a5c'; g.fillRect(x, y, 1, 2); g.fillRect(x + 1, y - 1, 1, 2); }
  if (rr() < 0.12) { g.fillStyle = '#8a8270'; g.fillRect(px + Math.floor(rr() * 13), py + Math.floor(rr() * 13), 2, 1); }
}
function paintDirt(g, px, py, rr) { speckle(g, px, py, rr, '#6a5640', ['#7c664a', '#5a4836', '#86704e', '#4e3e2e'], 40); }

  g.fillStyle = '#3a362f'; g.fillRect(px, py, TILE, TILE);

  while (x < 16) { const w = 3 + Math.floor(rr() * 4); g.fillStyle = rr() < 0.5 ? '#a49a86' : '#8e8472'; g.fillRect(px + x, py, Math.min(w, 16 - x) - 1, 4); g.fillStyle = '#c2b8a2'; g.fillRect(px + x, py, Math.min(w, 16 - x) - 1, 1); x += w; }
  // yüz
  for (let row = 0; row < 3; row++) {
    let xx = (row % 2) * 2 - 2;
    const yy = 5 + row * 4;
    while (xx < 16) {
      const w = 3 + Math.floor(rr() * 4);
      const a = Math.max(0, xx), b = Math.min(16, xx + w - 1);
      if (b > a) { g.fillStyle = ['#6e675a', '#7a7262', '#5e584c', '#857c6a'][Math.floor(rr() * 4)]; g.fillRect(px + a, py + yy, b - a, 3); g.fillStyle = '#958c78'; g.fillRect(px + a, py + yy, b - a, 1); }

}
function paintKirlar(g, v, x, y, px, py, rr) {
  switch (v) {
    case T.SKY: case T.VOID: g.clearRect(px, py, TILE, TILE); break;

    case T.WALL: paintStoneFace(g, px, py, rr); break;

class Actor {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, dir: 'down', frame: 0, animT: 0, moving: false, speed: 2.5, path: null, visible: true, pose: null, carry: null, lamp: null, alpha: 1, bob: 0, kind: 'tamar', skin: 'baba', name: '', faceDX: 0, faceDY: 1, onArrive: null, solid: false }, o);
  }
  sprites() { return this.kind === 'tamar' ? ART.tamar : ART.people[this.skin]; }
  walkTo(map, x, y, cb) {
    const p = map.findPath(this.x, this.y, x, y);
    this.path = p || [{ x, y }]; this.onArrive = cb || null;
  }
  goStraight(x, y, cb) { this.path = [{ x, y }]; this.onArrive = cb || null; }
  face(dx, dy) {
    if (Math.abs(dx) < 1e-4 && Math.abs(dy) < 1e-4) return;
    this.faceDX = dx; this.faceDY = dy;
    if (Math.abs(dx) > Math.abs(dy) * 1.1) this.dir = dx > 0 ? 'right' : 'left'; else this.dir = dy > 0 ? 'down' : 'up';
  }
  update(dt) {
    let moved = false;
    if (this.path && this.path.length) {
      const p = this.path[0], dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy), st = this.speed * dt;
      if (d <= st) { this.x = p.x; this.y = p.y; this.path.shift(); if (!this.path.length) { this.path = null; const cb = this.onArrive; this.onArrive = null; if (cb) cb(); } }
      else { this.x += (dx / d) * st; this.y += (dy / d) * st; this.face(dx, dy); }
      moved = true;
    }
    this.setMoving(moved, dt);
  }
  setMoving(m, dt) {
    this.moving = m;
    if (m) { this.animT += dt * this.speed * 1.6; this.frame = 1 + (Math.floor(this.animT) % 2); }
    else { this.frame = 0; this.animT = 0; }
  }
  draw(g, cx, cy) {
    if (!this.visible) return;
    const sx = Math.round(this.x * TILE - cx), sy = Math.round(this.y * TILE - cy) + 4;
    g.globalAlpha = this.alpha;
    let spr;
    if (this.pose === 'crouch') spr = ART.tamarCrouch;
    else if (this.pose === 'sitback') spr = ART.sitBack[this.skin];
    else { const set = this.sprites(); spr = set[this.dir][this.frame]; }
    const bob = this.moving && this.frame === 1 ? -1 : 0;
    // gölge
    g.fillStyle = 'rgba(0,0,10,0.35)'; g.fillRect(sx - 5, sy - 1, 10, 2);
    const lampBehind = this.lamp && this.dir === 'up';
    if (lampBehind) this.drawLamp(g, sx, sy + bob);
    g.drawImage(spr, sx - (spr.width >> 1), sy - spr.height + bob);
    if (this.carry === 'lamb') {
      const ls = ART.lamb.a, flip = this.dir === 'left';
      const lx = sx - 6 + (this.dir === 'right' ? 1 : this.dir === 'left' ? -2 : 0), ly = sy - (this.kind === 'tamar' ? 15 : 20) + bob;
      if (this.dir !== 'up') g.drawImage(flip ? ART.lambL.a : ls, lx, ly);
    }
    if (this.lamp && !lampBehind) this.drawLamp(g, sx, sy + bob);
    g.globalAlpha = 1;
  }
  lampScreenPos(sx, sy) {
    const L = this.lamp; const child = this.kind === 'tamar';
    let ox = this.dir === 'right' ? 5 : this.dir === 'left' ? -5 : this.dir === 'up' ? 4 : 3, oy;
    if (L.ground) { ox = this.dir === 'left' ? -9 : 9; oy = -1; }
    else if (child) oy = -11;
    else oy = L.raised ? -31 : -16;
    if (!L.ground && !child && L.raised) ox = this.dir === 'left' ? -6 : 6;
    return { x: sx + ox, y: sy + oy };
  }
  drawLamp(g, sx, sy) {
    const p = this.lampScreenPos(sx, sy);
    g.drawImage(ART.lamp, p.x - 3, p.y - 1);
    const f = ART.flame[Math.floor(State.time * 8) % 3];
    g.drawImage(f, p.x - 1, p.y - 4);
  }
  lampWorld() { const p = this.lampScreenPos(this.x * TILE, this.y * TILE + 4); return { x: p.x / TILE, y: p.y / TILE }; }
}

// ------------------------------------------------------------
// Sürü kuralları (§6.0 gündüz, §6.2 gece)
// ------------------------------------------------------------
const RING = 10, WHISTLE_R = 8, CHAIN_R = 2, GATHER_R = 3, SLIDE_MAX = 4, LIGHT_SPEED = 1.6, DARK_WHISTLE_SPEED = 0.8, DAY_SPEED = 1.2;
function segRectHit(x0, y0, x1, y1, R) {
  // ışın-dikdörtgen kesişimi (Liang–Barsky); giriş noktasını döndürür
  let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0;
  const p = [-dx, dx, -dy, dy], q = [x0 - R.x0, R.x1 - x0, y0 - R.y0, R.y1 - y0];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return null; }
    else { const r = q[i] / p[i]; if (p[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; } else { if (r < t0) return null; if (r < t1) t1 = r; } }
  }
  if (t0 <= 0) return null;
  return { x: x0 + dx * t0, y: y0 + dy * t0, t: t0 };
}
// Işığa yürüyüş rotası: aynı seki → düz; bitişik seki → geçit ya da en çok 4 karo kayma; yoksa takılır
function planPath(cx, cy, px, py) {
  const sc = sekiOf(cy), sp = sekiOf(py);
  if (sc === sp) {
    if (sc === 2) {
      const hit = segRectHit(cx, cy, px, py, CISTERN);
      if (hit) { const d = Math.hypot(px - cx, py - cy); return { pts: [{ x: hit.x - ((px - cx) / d) * 0.5, y: hit.y - ((py - cy) / d) * 0.5 }], stuck: true, why: 'sarnic' }; }
    }
    return { pts: [{ x: px, y: py }], stuck: false };
  }
  if (Math.abs(sc - sp) !== 1) return null;
  const upper = Math.min(sc, sp), wall = WALLS[upper];
  if (!wall) return null;
  const w = wall.y, dir = sign(py - cy), ya = w - dir * 0.5, yb = w + dir * 0.5;
  const cross = cx + (px - cx) * ((w - cy) / (py - cy));
  for (const [a, b] of wall.gaps) {
    if (cross >= a - 0.5 && cross <= b + 0.5) { const gx = clamp(cross, a, b); return { pts: [{ x: gx, y: ya }, { x: gx, y: yb }, { x: px, y: py }], stuck: false, slide: 0 }; }
  }
  const s = sign(px - cross), room = Math.abs(px - cross);
  let best = null;
  for (const [a, b] of wall.gaps) {
    if (s > 0 && a - 0.5 >= cross) { const d = a - 0.5 - cross; if (d <= SLIDE_MAX && d <= room && (!best || d < best.d)) best = { d, gx: a }; }
    if (s < 0 && b + 0.5 <= cross) { const d = cross - (b + 0.5); if (d <= SLIDE_MAX && d <= room && (!best || d < best.d)) best = { d, gx: b }; }
  }
  if (best) return { pts: [{ x: cross, y: ya }, { x: best.gx, y: ya }, { x: best.gx, y: yb }, { x: px, y: py }], stuck: false, slide: best.d };
  const stopX = cross + s * Math.min(SLIDE_MAX, room);
  return { pts: [{ x: cross, y: ya }, { x: stopX, y: ya }], stuck: true, why: 'duvar' };
}

const Flock = {
  sheep: [], map: null, night: false, lamp: null, lampId: 0, unit: null, slotsFor: null, slots: [], tamar: null,
  onMove: null, movedSinceRaise: false, raiseT: -1, raiseHandled: true,
  units: [],
  reset(map, list) { this.map = map; this.sheep = list; this.units = []; this.lamp = null; this.lampId++; this.slots = []; this.slotsFor = null; },
  inLight(s) { const L = this.lamp; return !!(L && L.raised && dist(s.x, s.y, L.x, L.y) <= RING + 1e-6); },
  // halkadaki yuvalar (kandile 1,5–2,6 karo)
  makeSlots(P) {
    const k = P.x + ',' + P.y;
    if (this.slotsFor === k) return;
    this.slotsFor = k; this.slots = [];
    for (let i = 0; i < 6; i++) { const a = (i / 6) * 6.283; this.slots.push({ x: P.x + Math.cos(a) * 1.6, y: P.y + Math.sin(a) * 1.25, s: null }); }
    for (let i = 0; i < 8; i++) { const a = ((i + 0.5) / 8) * 6.283; this.slots.push({ x: P.x + Math.cos(a) * 2.55, y: P.y + Math.sin(a) * 2.1, s: null }); }
    for (let i = 0; i < 10; i++) { const a = (i / 10) * 6.283 + 0.2; this.slots.push({ x: P.x + Math.cos(a) * 3.15, y: P.y + Math.sin(a) * 2.5, s: null }); }
    // duvarın içine ya da ardına düşen yuvaları ele
    this.slots = this.slots.filter((sl) => this.map.boxFree(sl.x, sl.y, 0.3, 0.2) && sekiOf(sl.y) === sekiOf(P.y) && this.lineFree(P, sl));
  },
  takeSlot(s, P) {
    this.makeSlots(P);
    if (s.slot && this.slots.includes(s.slot)) return s.slot;
    let best = null, bd = 1e9;
    for (const sl of this.slots) { if (sl.s && sl.s !== s) continue; const d = dist(sl.x, sl.y, s.x, s.y); if (d < bd) { bd = d; best = sl; } }
    if (!best) best = { x: P.x + (Math.random() - 0.5) * 1.2, y: P.y + (Math.random() - 0.5) * 0.8, s: null };
    if (s.slot) s.slot.s = null;
    best.s = s; s.slot = best;
    return best;
  },
  freeSlot(s) { if (s.slot) { s.slot.s = null; s.slot = null; } },
  lineFree(a, b) {
    const n = Math.ceil(dist(a.x, a.y, b.x, b.y) * 4);
    for (let i = 1; i <= n; i++) { const x = lerp(a.x, b.x, i / n), y = lerp(a.y, b.y, i / n); if (this.map.solidAt(x, y)) return false; }
    return true;
  },
  // -------- olaylar --------
  lampRaised(P) {
    this.lampId++;
    this.lamp = { x: P.x, y: P.y, raised: true };
    this.movedSinceRaise = false; this.raiseT = 0; this.raiseHandled = false;
    // toplanmış birimler: merkez = toplandığı taş (ya da takıldığı nokta) — Kural 7
    const gathered = this.sheep.filter((s) => s.gathered && !s.inFold && s.mode !== 'unit' && s.gatherAt);
    const groups = [];
    for (const s of gathered) {
      let g = groups.find((gr) => dist(gr.C.x, gr.C.y, s.gatherAt.x, s.gatherAt.y) < 1.0);
      if (!g) { g = { C: s.gatherAt, members: [] }; groups.push(g); }
      g.members.push(s);
    }
    for (const g of groups) {
      const d = dist(g.C.x, g.C.y, P.x, P.y);
      if (d < 0.05) { g.members.forEach((s) => (s.evalId = this.lampId)); continue; }
      if (d > RING + 1e-6) { g.members.forEach((s) => (s.evalId = this.lampId)); continue; }
      const plan = planPath(g.C.x, g.C.y, P.x, P.y);
      if (plan) this.startUnit(g.members, g.C, plan, P);
      else g.members.forEach((s) => (s.evalId = this.lampId));
    }
  },
  lampLowered() { if (this.lamp) this.lamp.raised = false; },
  startUnit(members, C, plan, P) {
    // birim üyeleri öndekinden arkadakine sıralanır (yola en yakın önde)
    const first = plan.pts[0];
    members.sort((a, b) => dist(a.x, a.y, first.x, first.y) - dist(b.x, b.y, first.x, first.y));
    const U = { members, pts: plan.pts.slice(), x: C.x, y: C.y, stuck: plan.stuck, P: { x: P.x, y: P.y }, trail: [{ x: C.x, y: C.y }], done: false };
    members.forEach((s, i) => { s.gathered = false; s.mode = 'unit'; s.rank = i; s.evalId = this.lampId; this.freeSlot(s); s.stuck = false; s.unit = U; s.ti = 0; s.goal = null; });
    this.units.push(U);

  },
  whistle(W, tamarSeki) {
    const night = this.night;
    let n = 0;
    for (const s of this.sheep) {
      if (s.inFold) continue;
      if (sekiOf(s.y) !== tamarSeki) continue;
      if (dist(s.x, s.y, W.x, W.y) > WHISTLE_R + 1e-6) { continue; }
      if (night && (this.inLight(s) || s.mode === 'unit')) { s.earsT = 1.4; continue; }
      this.sendWhistle(s, W); n++;
    }
    // zincir (aynı seki, 2 karo)
    this.chain();
    return n;
  },
  sendWhistle(s, W) {
    s.gathered = false; this.freeSlot(s); s.stuck = false;
    s.mode = 'whistle'; s.goal = { x: W.x, y: W.y }; s.stopR = 1.5; s.speed = this.night ? DARK_WHISTLE_SPEED : DAY_SPEED; s.whistleAt = { x: W.x, y: W.y };
    s.evalId = -1;
  },
  staff(T0, fx, fy, second) {
    const out = { dark: 0, light: 0, pushed: 0 };
    const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
    for (const s of this.sheep) {
      if (s.inFold) continue;
      const dx = s.x - T0.x, dy = s.y - T0.y, d = Math.hypot(dx, dy);
      if (d > 4 || d < 0.01) continue;
      const cos = (dx * fx + dy * fy) / d;
      if (cos < Math.cos(Math.PI / 6)) continue;
      if (this.night) {
        if (this.inLight(s) || s.mode === 'unit') { s.earsT = 1.2; out.light++; }
        else { s.startleT = 2; s.mode = s.mode === 'whistle' ? 'whistle' : 'idle'; out.dark++; if (Math.random() < 0.7) Audio.bleat('koyun', s.x, 0.25); }
      } else {
        const len = second && s.mode === 'push' && s.pushN === 1 ? 2 : 3;
        // koninin ekseni boyunca, Tamar'dan uzaklaşan yönde (sürü dağılmasın diye eksen ağırlıklı)
        let ux = fx * 0.75 + (dx / d) * 0.25, uy = fy * 0.75 + (dy / d) * 0.25; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
        const base = s.mode === 'push' && s.goal ? s.goal : { x: s.x, y: s.y };
        s.mode = 'push'; s.pushN = (second && s.pushN === 1) ? 2 : 1; s.speed = DAY_SPEED; s.stopR = 0.05;
        s.goal = this.clampGoal(s, { x: base.x + ux * len, y: base.y + uy * len });
        s.gathered = false; this.freeSlot(s);
        out.pushed++;

    }

  },
  clampGoal(s, g) {

    const steps = 12; let last = { x: s.x, y: s.y };
    for (let i = 1; i <= steps; i++) {
      const p = { x: lerp(s.x, g.x, i / steps), y: lerp(s.y, g.y, i / steps) };
      if (this.map.solidAt(p.x, p.y) || sekiOf(p.y) !== sekiOf(s.y)) break;
      last = p;
    }
    return last;
  },
  chain() {
    let changed = true, guard = 0;
    while (changed && guard++ < 12) {
      changed = false;
      for (const a of this.sheep) {
        if (a.inFold || !(a.mode === 'whistle' || a.mode === 'seek' || a.mode === 'push')) continue;
        for (const b of this.sheep) {
          if (b === a || b.inFold || b.mode !== 'idle' || b.gathered || b.startleT > 0) continue;
          if (sekiOf(a.y) !== sekiOf(b.y) || dist(a.x, a.y, b.x, b.y) > CHAIN_R + 1e-6) continue;
          if (a.mode === 'whistle') this.sendWhistle(b, a.whistleAt);
          else if (a.mode === 'push') { b.mode = 'push'; b.pushN = a.pushN; b.speed = DAY_SPEED; b.stopR = 0.05; b.goal = this.clampGoal(b, { x: b.x + (a.goal.x - a.x), y: b.y + (a.goal.y - a.y) }); }
          else if (a.mode === 'seek' && this.lamp && this.lamp.raised) this.seekLamp(b, true);
          changed = true;
        }
      }
    }
  },
  seekLamp(s, viaChain) {
    const L = this.lamp; if (!L || !L.raised) return false;
    const plan = planPath(s.x, s.y, L.x, L.y);
    s.evalId = this.lampId;
    if (!plan) { s.mode = 'idle'; return false; }
    s.gathered = false; s.stuck = false; s.seekP = { x: L.x, y: L.y }; s.goal = null;
    if (plan.stuck) {
      s.mode = 'seek'; s.pts = plan.pts.slice(); s.speed = LIGHT_SPEED; s.stopR = 0.1; s.willStick = true;
    } else {
      const sl = this.takeSlot(s, L);
      const pts = plan.pts.slice(); pts[pts.length - 1] = { x: sl.x, y: sl.y };
      s.mode = 'seek'; s.pts = pts; s.speed = LIGHT_SPEED; s.stopR = 0.08; s.willStick = false;
    }
    this.movedSinceRaise = true;
    return true;
  },
  // -------- kare güncellemesi --------
  update(dt) {
    const L = this.lamp, map = this.map;
    if (this.raiseT >= 0) this.raiseT += dt;
    // birim hareketi: merkez rotayı izler; üyeler merkezin bıraktığı izi (ekmek kırıntısı) sırayla izler
    for (let ui = this.units.length - 1; ui >= 0; ui--) {
      const U = this.units[ui];
      if (!U.done) {
        let st = LIGHT_SPEED * dt;
        while (st > 0 && U.pts.length) {
          const p = U.pts[0], d = dist(U.x, U.y, p.x, p.y);
          if (d <= st) { U.x = p.x; U.y = p.y; U.pts.shift(); st -= d; }
          else { U.x += ((p.x - U.x) / d) * st; U.y += ((p.y - U.y) / d) * st; st = 0; }
        }
        const last = U.trail[U.trail.length - 1];
        if (dist(last.x, last.y, U.x, U.y) > 0.12 || !U.pts.length) U.trail.push({ x: U.x, y: U.y });
        if (!U.pts.length) {
          U.done = true;
          const end = { x: U.x, y: U.y };
          U.members.forEach((s) => { s.gathered = true; s.stuck = !!U.stuck; s.gatherAt = U.stuck ? end : { x: U.P.x, y: U.P.y }; });
          U.end = end;
        }
      }
      let alive = 0;
      const n = U.trail.length;
      for (const s of U.members) {
        if (s.unit !== U || s.mode !== 'unit') continue;
        alive++;
        const maxIdx = U.done ? n - 1 : Math.max(0, n - 1 - (3 + s.rank * 4));
        let tp = U.trail[Math.min(s.ti, n - 1)];
        while (s.ti < maxIdx && dist(s.x, s.y, tp.x, tp.y) < 0.6) { s.ti++; tp = U.trail[s.ti]; }
        if (U.done && s.ti >= n - 1 && dist(s.x, s.y, tp.x, tp.y) < 0.75) {
          s.unit = null;
          if (U.stuck) {
            const i = s.rank, dirY = sign(U.P.y - U.end.y) || 1;
            let g = { x: U.end.x + ((i % 6) - 2.5) * 0.72, y: U.end.y - dirY * (0.35 + Math.floor(i / 6) * 0.8) };
            if (this.map.solidAt(g.x, g.y) || !this.lineFree(U.end, g)) g = { x: U.end.x + (Math.random() - 0.5) * 0.4, y: U.end.y - dirY * 0.4 };
            s.mode = 'stuckunit'; s.goal = g; s.speed = 1.2; s.bleatT = 0.4 + i * 0.35;
          } else {
            const sl = this.takeSlot(s, U.P);
            s.mode = 'arrive'; s.goal = { x: sl.x, y: sl.y }; s.speed = 1.5;
          }
        } else {
          s.goal = { x: tp.x, y: tp.y };
          s.speed = LIGHT_SPEED + Math.min(1.4, dist(s.x, s.y, tp.x, tp.y) * 0.5);
        }
      }
      if (U.done && !alive) this.units.splice(ui, 1);
    }
    for (const s of this.sheep) {
      if (s.inFold && s.mode !== 'tofold') { this.moveSheep(s, dt, null, 0); continue; }
      if (s.startleT > 0) s.startleT -= dt;
      if (s.earsT > 0) s.earsT -= dt;
      // ışık kuralı (gece): halkadaki serbest koyun kandile yürür
      if (this.night && L && L.raised && s.evalId !== this.lampId && (s.mode === 'idle' || s.mode === 'whistle') && !s.gathered && s.startleT <= 0) {
        if (dist(s.x, s.y, L.x, L.y) <= RING + 1e-6) this.seekLamp(s);
      }
      let goal = null, speed = 0;
      switch (s.mode) {
        case 'seek': {
          if (s.pts && s.pts.length) {
            const p = s.pts[0];
            if (dist(s.x, s.y, p.x, p.y) < (s.pts.length > 1 ? 0.35 : 0.25)) s.pts.shift();
          }
          if (s.pts && s.pts.length) { goal = s.pts[0]; speed = s.speed; }
          else {
            s.mode = s.willStick ? 'stuck' : 'arrive'; s.goal = null;
            s.gathered = true; s.stuck = !!s.willStick;
            if (s.willStick) {
              const near = this.sheep.find((o) => o !== s && o.stuck && o.gatherAt && dist(o.gatherAt.x, o.gatherAt.y, s.x, s.y) < 2.2);
              s.gatherAt = near ? near.gatherAt : { x: s.x, y: s.y };
            } else s.gatherAt = s.seekP ? { x: s.seekP.x, y: s.seekP.y } : { x: s.x, y: s.y };
          }
          break;
        }
        case 'whistle': {
          const d = dist(s.x, s.y, s.goal.x, s.goal.y);
          if (d <= s.stopR) {
            s.mode = 'idle'; s.goal = null; if (!this.night) { s.home = { x: s.x, y: s.y }; }
            // ıslık noktası halkanın içindeyse, varan koyun 2. kurala geçer (Kural 6)
            if (this.night && L && L.raised && s.whistleAt && dist(s.whistleAt.x, s.whistleAt.y, L.x, L.y) <= RING + 1e-6) this.seekLamp(s);
          }
          else { goal = s.goal; speed = s.speed; }
          break;
        }
        case 'push': {
          const d = dist(s.x, s.y, s.goal.x, s.goal.y);
          if (d <= 0.12) { s.mode = 'idle'; s.home = { x: s.x, y: s.y }; s.goal = null; }
          else { goal = s.goal; speed = s.speed; }
          break;
        }
        case 'unit': goal = s.goal; speed = s.speed; break;
        case 'arrive': case 'stuckunit': case 'stuck':
          if (s.goal) { goal = s.goal; speed = s.speed || 1.4; if (dist(s.x, s.y, goal.x, goal.y) < 0.1) { s.goal = null; } }
          break;
        case 'tofold': case 'script': goal = s.goal; speed = s.speed; if (goal && dist(s.x, s.y, goal.x, goal.y) < 0.15) { s.goal = null; if (s.onArrive) { const f = s.onArrive; s.onArrive = null; f(s); } } break;
        case 'idle': default:
          if (!this.night && !s.goal) {
            s.grazeT -= dt;
            if (s.grazeT <= 0) { s.grazeT = 3 + Math.random() * 5; s.wander = { x: s.home.x + (Math.random() - 0.5) * 1.2, y: s.home.y + (Math.random() - 0.5) * 0.8 }; }
            if (s.wander && dist(s.x, s.y, s.wander.x, s.wander.y) > 0.1 && !map.solidAt(s.wander.x, s.wander.y)) { goal = s.wander; speed = 0.35; }
          }
      }
      if (s.startleT > 0) { goal = null; }
      this.moveSheep(s, dt, goal, speed);
      // meleme
      s.bleatT -= dt;
      if (s.bleatT <= 0) {
        s.bleatT = (s.stuck ? 3 : 5 + Math.random() * 6);
        if (!s.inFold && s.visible) this.bleat(s);
      }
    }
    if (this.night) this.chain();
    // yürüyüş algısı (babanın "ışığım ulaşmıyor" sözü)
    if (!this.movedSinceRaise && this.sheep.some((s) => s.mode === 'seek' || s.mode === 'unit')) this.movedSinceRaise = true;
  },
  bleat(s) {
    const kind = s.mother ? 'ana' : 'koyun';
    if (this.night && s.mode !== 'idle' && !s.stuck && Math.random() < 0.5) return;
    const vis = this.tamar ? dist(s.x, s.y, this.tamar.x, this.tamar.y) : 0;
    Audio.bleat(kind, s.x, clamp(0.4 - vis * 0.015, 0.05, 0.4));
    Ripples.add(s.x, s.y - 0.5, 'thick');
  },
  moveSheep(s, dt, goal, speed) {
    let dx = 0, dy = 0;
    if (goal && speed > 0) {
      const gx = goal.x - s.x, gy = goal.y - s.y, d = Math.hypot(gx, gy);
      if (d > 0.02) { const sp = Math.min(speed, d * 3 + 0.25); dx = (gx / d) * sp; dy = (gy / d) * sp; }
    }
    // ayrışma (boids-lite)
    let sx = 0, sy = 0;
    for (const o of this.sheep) {
      if (o === s || o.inFold !== s.inFold) continue;
      const ox = s.x - o.x, oy = s.y - o.y, d2 = ox * ox + oy * oy;
      if (d2 < 0.72 && d2 > 1e-6) { const d = Math.sqrt(d2), f = (0.85 - d) * 2.2; sx += (ox / d) * f; sy += (oy / d) * f; }
    }
    if (s.mode === 'unit' || s.mode === 'tofold' || s.mode === 'script') { sx *= 0.45; sy *= 0.45; }
    const tx = dx + sx, ty = dy + sy;
    const k = Math.min(1, dt * 6);
    s.vx += (tx - s.vx) * k; s.vy += (ty - s.vy) * k;
    const sp = Math.hypot(s.vx, s.vy), maxS = Math.max(speed, 0.6) * 1.15 + 0.4;
    if (sp > maxS) { s.vx *= maxS / sp; s.vy *= maxS / sp; }
    const nx = s.x + s.vx * dt, ny = s.y + s.vy * dt;
    const map = this.map, rx = 0.32, ry = 0.22;
    const fold = s.inFold;
    const free = (x, y) => map.boxFree(x, y, rx, ry) && (fold || s.mode === 'tofold' || s.mode === 'script' || this.sameZone(s, y));
    if (free(nx, s.y)) s.x = nx; else s.vx = 0;
    if (free(s.x, ny)) s.y = ny; else s.vy = 0;
    if (Math.abs(s.vx) > 0.05) s.faceR = s.vx > 0;
    const moving = sp > 0.12;
    s.animT += dt * (moving ? 6 : 0);
    s.moving = moving;
  },
  sameZone(s, y) { return true; },
};

// Baba: durak taşı çağrısı (§6.2 Kural 8) ve ret cümleleri
// ------------------------------------------------------------
const FATHER_LINES = {
  iki: 'Bir seferde tek seki, Tamar. Koyunlar duvardan atlayamaz.',
  a: 'Doğuda daha koyun var, duymuyor musun? Hepsi ışığa gelmeden inmem.',
  b: 'Yukarıda koyun kaldı. Önce onları alalım.',
  ulasmiyor: 'Işığım onlara ulaşmıyor, kızım.',
};
function fatherCanGo(father, targetId) {
  const T0 = STONES[father.stone] || { x: father.x, y: father.y }, Tt = STONES[targetId];
  const fs = sekiOf(T0.y), ts = sekiOf(Tt.y);
  if (Math.abs(ts - fs) >= 2) return { ok: false, line: 'iki' };
  if (ts === fs + 1) {
    const L = { x: T0.x, y: T0.y };
    const onMine = Flock.sheep.filter((s) => !s.inFold && sekiOf(s.y) === fs);
    const allGathered = onMine.every((s) => s.gathered && !s.stuck && s.gatherAt && dist(s.gatherAt.x, s.gatherAt.y, L.x, L.y) < 0.01 && dist(s.x, s.y, L.x, L.y) <= GATHER_R + 0.6);
    if (!allGathered) return { ok: false, line: 'a' };
    if (Flock.sheep.some((s) => !s.inFold && sekiOf(s.y) < fs)) return { ok: false, line: 'b' };
  }
  return { ok: true };
}

const Player = {
  a: null, map: null, gutT: -1, charging: false, cancelled: false, lastTapT: -10, tapCount: 0,

// Sahne yöneticisi + Kırlar dünyası ve sahneleri (2–5, 7)

const Scenes = {
  defs: {}, order: [], current: null, busy: false,
  define(id, def) { def.id = id; this.defs[id] = def; this.order.push(id); },
  goto(id, opts) {
    opts = opts || {};
    const def = this.defs[id];
    if (!def) { console.warn('sahne yok: ' + id); return; }
    const doSwitch = () => {
      if (this.current && this.current.exit) { try { this.current.exit(); } catch (e) { console.error(e); } }
      Scripts.killExcept('transition'); UI.closeHint(); UI.clearBark(); UI.prompt(null); UI.objective(null); UI.usta(0, false);
      if (UI.dlg.active) { UI.dlg.active = false; $('dialog').classList.add('hidden'); }
      if (UI.ch.active) { UI.ch.active = false; $('choices').classList.add('hidden'); }
      if (UI.cardActive) UI.closeCard();
      Gfx.clearParticles(); Ripples.clear();
      Audio.setTone(false); Audio.cluster(false);
      this.current = def; State.sceneId = id; Hints.reset();
      Player.enabled = true; Player.allowGut = true; Player.allowLook = true; Player.collide = null; Player.bounds = null; Player.onWhistle = null; Player.onStaff = null;
      Cam.look = 0; Cam.lookTarget = 0; Cam.minY = null;
      try { def.enter(opts.arg); } catch (e) { console.error(e); }
      Bus.emit('scene', id);
    };
    if (opts.instant) { Scripts.kill('transition'); this.busy = false; doSwitch(); UI.fade(0, 0.5); return; }
    if (this.busy) return;
    this.busy = true;
    const self = this;
    Scripts.run(function* () {
      yield UI.fade(1, opts.fadeOut == null ? 0.8 : opts.fadeOut);
      self.busy = false;
      doSwitch();
      yield 0.15;
      yield UI.fade(0, opts.fadeIn == null ? 0.9 : opts.fadeIn);
    }, 'transition');
  },
};

const Hints = {
  level: 0, ctx: null, flash: 0,
  reset() { this.level = 0; this.ctx = null; this.flash = 0; },
  request() {
    const sc = Scenes.current;
    if (!sc || !sc.hint || UI.blocking()) { UI.bark('Şimdi bir ışığa gerek yok.', null, 2, true); return; }
    const h = sc.hint();
    if (!h) { UI.bark('Şimdi bir ışığa gerek yok.', null, 2, true); return; }
    if (h.ctx !== this.ctx) { this.ctx = h.ctx; this.level = 0; }
    this.level = Math.min(3, this.level + 1);
    State.stats.ipucu++;
    const L = h.levels[this.level - 1];
    if (L.fx) L.fx();
    this.flash = this.level === 2 ? 30 : this.flash;
    UI.showHint(this.level, L.text, { think: L.think, who: L.who, onContinue: this.level >= 3 ? h.onContinue : null });
  },
  auto(level) { // kural gereği kendiliğinden gelen ışık (ör. ikinci yanlış kapı)
    const sc = Scenes.current; if (!sc || !sc.hint) return;
    const h = sc.hint(); if (!h) return;
    this.ctx = h.ctx; this.level = level - 1; this.request();
  },
};
Bus.on('hintRequest', () => Hints.request());

      for (let y = 5; y <= 9; y++) g.strokeRect(Math.round((21 - 0.5) * TILE - cx) + 0.5, Math.round((y - 0.5) * TILE - cy) + 0.5, 15, 15);

function blitMap(g, img, sx, sy) {
  sx = Math.round(sx); sy = Math.round(sy);

  if (sx < 0) { dx = -sx; w += sx; sx = 0; }
  if (sy < 0) { dy = -sy; h += sy; sy = 0; }
  if (sx + w > img.width) w = img.width - sx;
  if (sy + h > img.height) h = img.height - sy;
  if (w > 0 && h > 0) g.drawImage(img, sx, sy, w, h, dx, dy, w, h);
}
function drawSheep(g, s, cx, cy) {
  const sx = Math.round(s.x * TILE - cx), sy = Math.round(s.y * TILE - cy) + 4;

  else if (s.earsT > 0 || (Flock.night && Flock.inLight(s))) spr = set.ears;
  else spr = (Math.sin(s.grazeT * 1.3 + s.id) > 0.2 && !Flock.night) || (s.mode === 'idle' && Math.sin(State.time * 0.5 + s.id) > 0.3) ? set.graze : set.a;

  g.fillStyle = 'rgba(0,0,10,0.35)'; g.fillRect(sx - 6, sy - 1, 12, 2);
  g.drawImage(spr, sx - 8 + jx, sy - spr.height);
  if (s.stuck && Flock.night && (State.time * 2 + s.id) % 3 < 1.2) { g.fillStyle = '#e8c66a'; g.fillRect(sx - 1, sy - 17, 2, 4); g.fillRect(sx - 1, sy - 12, 2, 1); }
}
function drawLamb(g, L, cx, cy) {
  const sx = Math.round(L.x * TILE - cx), sy = Math.round(L.y * TILE - cy) + 4;
  const set = L.faceR ? ART.lamb : ART.lambL;
  const spr = L.moving && Math.floor(L.animT * 6) % 2 ? set.b : set.a;

}
function drawObj(g, o, cx, cy, w) {
  const sx = Math.round(o.x * TILE - cx), sy = Math.round(o.y * TILE - cy) + 4;
  switch (o.kind) {
    case 'tree': case 'rock': case 'bush': case 'stone': case 'lambbush': case 'gatebush':
      g.drawImage(o.spr, sx - (o.spr.width >> 1), sy - o.spr.height);
      if (o.kind === 'stone') { g.fillStyle = 'rgba(30,26,20,0.7)'; g.fillRect(sx - 1, sy - 8, 2, 1); }
      break;
    case 'fire': {
      g.fillStyle = '#0a0b1a'; g.fillRect(sx - 7, sy - 4, 14, 5);
      g.fillStyle = '#6e675a'; [[-7, -3], [-4, -1], [2, -1], [5, -3], [-1, -4]].forEach(([a, b]) => g.fillRect(sx + a, sy + b, 3, 2));
      g.fillStyle = '#4a3020'; g.fillRect(sx - 4, sy - 3, 8, 2);
      if (w.fireLit) {
        const t = State.time;
        for (let i = 0; i < 9; i++) {
          const h = 3 + ((Math.sin(t * 9 + i * 1.7) + 1) * 3.5) | 0, x = sx - 4 + i;
          g.fillStyle = '#e06a2a'; g.fillRect(x, sy - 3 - h, 1, h);
          if (i > 1 && i < 7) { g.fillStyle = '#ffb35c'; g.fillRect(x, sy - 3 - Math.max(1, h - 3), 1, Math.max(1, h - 3)); }
          if (i > 2 && i < 6) { g.fillStyle = '#fff0b0'; g.fillRect(x, sy - 4, 1, 2); }
        }
      }
      break;
    }
    case 'house': {
      const wpx = o.w * TILE, x0 = sx - wpx / 2, y0 = sy - 34;
      g.fillStyle = '#0a0b1a'; g.fillRect(x0 - 1, y0 - 1, wpx + 2, 36);
      g.fillStyle = '#8a7a62'; g.fillRect(x0, y0 + 6, wpx, 28);
      g.fillStyle = '#a8987a'; for (let k = 0; k < wpx; k += 6) g.fillRect(x0 + k, y0 + 10 + ((k / 6) % 2) * 6, 4, 2);
      g.fillStyle = '#5a4a36'; g.fillRect(x0 - 1, y0, wpx + 2, 6); g.fillStyle = '#7a6a50'; g.fillRect(x0, y0 + 1, wpx, 2);
      g.fillStyle = '#16120e'; g.fillRect(x0 + wpx / 2 - 4, y0 + 19, 8, 15);
      break;
    }
    case 'foldgate': {
      g.fillStyle = '#4a3020'; g.fillRect(sx - 9, sy - 18, 2, 16); g.fillRect(sx + 7, sy - 18, 2, 16);
      if (w.gateClosed) { g.fillStyle = '#6a4a2a'; for (let k = 0; k < 3; k++) g.fillRect(sx - 7, sy - 15 + k * 5, 14, 2); }

function drawCone(g, t, cx, cy) {
  const ox = t.x * TILE - cx, oy = t.y * TILE - cy, a0 = Math.atan2(t.faceDY, t.faceDX), R = 4 * TILE;
  const al = clamp(t.staffT / 0.25, 0, 1) * 0.6;
  Gfx.dashedLine(ox, oy, ox + Math.cos(a0 - 0.52) * R, oy + Math.sin(a0 - 0.52) * R, '#e8dcb8', al);
  Gfx.dashedLine(ox, oy, ox + Math.cos(a0 + 0.52) * R, oy + Math.sin(a0 + 0.52) * R, '#e8dcb8', al);
  g.fillStyle = '#e8dcb8'; g.globalAlpha = al;
  for (let a = -0.52; a <= 0.52; a += 0.06) g.fillRect(Math.round(ox + Math.cos(a0 + a) * R), Math.round(oy + Math.sin(a0 + a) * R), 1, 1);
  g.globalAlpha = 1;
}
// Bakış: etkileşimli nesnelerde ince kenar ışığı
function drawRims(g, w, cx, cy) {
  const pulse = 0.6 + 0.4 * Math.sin(State.time * 4);
  const herding = Scenes.current && (Scenes.current.id === 'isigin_ardindan' || Scenes.current.id === 'yamac_ogretim');
  if (herding || w.showStonesFX > 0) {
    for (const o of w.objs) if (o.kind === 'stone') { g.globalAlpha = (w.showStonesFX > 0 ? 1 : 0.7) * pulse; g.drawImage(ART.stoneRim, Math.round(o.x * TILE - cx) - 6, Math.round(o.y * TILE - cy) + 4 - ART.stone.height - 1); }
    const k = STONES.T8; g.globalAlpha = pulse * 0.8; g.strokeStyle = '#ffe9a8';
    g.strokeRect(Math.round((k.x - 0.6) * TILE - cx) + 0.5, Math.round((k.y + 0.2) * TILE - cy) + 0.5, 19, 15);
    g.globalAlpha = 1;
  }
  if (w.showGapsFX > 0) {
    g.globalAlpha = pulse; g.strokeStyle = '#ffe9a8';
    [[2, 3, 10], [16, 17, 21], [4, 5, 30]].forEach(([a, b, y]) => g.strokeRect(Math.round((a - 0.5) * TILE - cx) + 0.5, Math.round((y - 0.5) * TILE - cy) + 0.5, (b - a + 1) * TILE - 1, TILE - 1));
    g.globalAlpha = 1;
  }
  if (w.rimTargets) w.rimTargets(g, cx, cy, pulse);
}
// ses dalgaları: ekranda halka, ekran dışında kenar göstergesi (ince tek / kalın çift)
function drawRipples(g, w, cx, cy) {
  if (!Player.bakis && !w.forceIndicators) return;
  const t = w.tamar;
  for (const r of Ripples.list) {
    if (w.indicators === 'lamb' && r.kind !== 'thin' && r.kind !== 'thick') continue;
    const sx = r.x * TILE - cx, sy = r.y * TILE - cy;
    const thin = r.kind === 'thin';
    const k = r.t / 1.6, a = (1 - k) * 0.9;
    const big = thin && w.lambIndicatorBig ? 2 : 1;
    // duvar dibinde kuzunun yönü kaybolur: ses duvarın içinden geliyormuş gibi titrer
    if (thin && w.lambWallConfuse && w.lambWallConfuse()) {
      const jx = (Math.sin(State.time * 23) + Math.sin(State.time * 31)) * 10;
      const px = t.x * TILE - cx + jx, py = 0 * TILE - cy;
      g.globalAlpha = a; g.strokeStyle = '#e8eeff'; g.lineWidth = 1;
      g.beginPath(); g.arc(px, py + 4, 6 + k * 14, 0.2, Math.PI - 0.2); g.stroke();
      g.globalAlpha = 1;
      continue;
    }
    if (sx > 6 && sx < VW - 6 && sy > 6 && sy < VH - 6) {
      g.strokeStyle = thin ? '#eef2ff' : '#ffe2b0'; g.globalAlpha = a;
      if (thin) { g.lineWidth = big; g.beginPath(); g.arc(sx, sy, 3 + k * 22 * big, 0, 6.283); g.stroke(); }
      else { g.lineWidth = 2; g.beginPath(); g.arc(sx, sy, 3 + k * 18, 0, 6.283); g.stroke(); g.beginPath(); g.arc(sx, sy, 8 + k * 18, 0, 6.283); g.stroke(); }
      g.globalAlpha = 1; g.lineWidth = 1;
    } else {
      const ccx = VW / 2, ccy = VH / 2, dx = sx - ccx, dy = sy - ccy;
      const s = Math.min((VW / 2 - 16) / Math.abs(dx || 1e-6), (VH / 2 - 16) / Math.abs(dy || 1e-6));
      const ex = ccx + dx * s, ey = ccy + dy * s, ang = Math.atan2(dy, dx);
      g.strokeStyle = thin ? '#eef2ff' : '#ffe2b0'; g.globalAlpha = a;
      const rr = (thin ? 7 : 6) * big + k * 4;
      if (thin) { g.lineWidth = big; g.beginPath(); g.arc(ex - Math.cos(ang) * 6, ey - Math.sin(ang) * 6, rr, ang - 0.9, ang + 0.9); g.stroke(); }
      else { g.lineWidth = 2.5; g.beginPath(); g.arc(ex - Math.cos(ang) * 8, ey - Math.sin(ang) * 8, rr, ang - 0.8, ang + 0.8); g.stroke(); g.beginPath(); g.arc(ex - Math.cos(ang) * 8, ey - Math.sin(ang) * 8, rr + 5, ang - 0.8, ang + 0.8); g.stroke(); }
      g.globalAlpha = 1; g.lineWidth = 1;
    }
  }
}

      { x: 18.5, y: -1.2, r: 1.8, label: 'Dikenleri değnekle arala', enabled: () => sc.climbed && !sc.done && !sc.busy, action: () => sc.rescue() },
    ];
  },
  climb() {
    const sc = this, t = KW.tamar;
    sc.busy = true; Player.enabled = false;
    Scripts.run(function* () {
      t.goStraight(20, 1.2); yield until(() => !t.path);
      t.dir = 'up';
      Audio.rustle(20);
      for (let i = 0; i < 3; i++) { t.y -= 0.6; t.setMoving(true, 0.2); Audio.step(20); yield 0.28; }
      t.x = 20; t.y = -1.1; t.setMoving(false, 0);
      Cam.minY = -7.5;
      sc.climbed = true; sc.busy = false; Player.enabled = true;
    }, 'scene');
  },
  rescue() {
    const sc = this, t = KW.tamar, f = KW.father, L = KW.lamb;
    sc.busy = true; Player.enabled = false; sc.done = true;
    Scripts.run(function* () {
      t.goStraight(19.6, -1.3); yield until(() => !t.path);
      t.dir = 'left'; t.staffT = 0.3;
      Audio.rustle(18.5); yield 0.9; Audio.staff(18.5); yield 0.6; Audio.rustle(18.5);
      KW.lambBleat(0.35); yield 0.9;
      L.visible = false; L.mode = 'carried'; t.carry = 'lamb';
      State.flags.kol_b01_kuzu_yunu = true;
      UI.bark('Dikende bir tutam yün kalmış... Alıp kuşağıma soktum.', 'Tamar', 3, true);
      yield 1.6;
      // iniş
      t.goStraight(20, -0.9); yield until(() => !t.path);
      t.dir = 'down';
      for (let i = 0; i < 3; i++) { t.y += 0.7; Audio.step(20); yield 0.25; }
      t.y = 1.2; Cam.minY = -0.5;
      yield 0.3;
      // kuzu topallayarak babaya gider
      t.carry = null; L.visible = true; L.mode = 'limp'; L.x = 20.4; L.y = 1.8; L.speed = 0.8;
      L.goal = { x: STONES.T2.x + 1.4, y: STONES.T2.y + 0.5 };
      UI.objective(null);
      KW.camFocus = { x: 16, y: 5 };
      yield until(() => !L.goal);
      f.sitting = false; f.dir = 'right';
      yield 0.4;
      L.visible = false; L.mode = 'carried'; f.carry = 'lamb';
      KW.lambBleat(0.25);
      yield 1.2;
      KW.camFocus = null;
      Player.enabled = true;
      Scenes.goto('isigin_ardindan', { fadeOut: 0.6, fadeIn: 0.6, arg: { keep: true } });
    }, 'scene');
  },
  update(dt) {
    const sc = this, t = KW.tamar;
    KW.update(dt); Player.update(dt);
    // meleme döngüsü: kuzu 5 sn'de bir, anası 1 sn sonra
    if (!sc.done) {
      sc.cycle -= dt;
      if (sc.cycle <= 0) { sc.cycle = 5; KW.lambBleat(); sc.answer = 1; }
      if (sc.answer > 0) { sc.answer -= dt; if (sc.answer <= 0) { const m = KW.mother(); Audio.bleat('ana', m.x, clamp(0.45 - dist(m.x, m.y, t.x, t.y) * 0.015, 0.1, 0.45)); Ripples.add(m.x, m.y - 0.5, 'thick'); } }
    }
    if (sc.bakisPromptT > 0) { sc.bakisPromptT -= dt; if (!Player.focus) UI.prompt('bakis', 'Bakış: basılı tut — sesler belirginleşir'); if (Player.bakis) sc.bakisPromptT = 0; if (sc.bakisPromptT <= 0) UI.prompt(null); }
    if (Player.lookUp && t.y < 3.5) sc.lookedUp = true;
    // yanlış deneme: anaya varmak
    const m = KW.mother();
    if (m && dist(m.x, m.y, t.x, t.y) < 1.4 && State.time - sc.motherSaid > 8) {
      sc.motherSaid = State.time; m.faceR = t.x > m.x; m.earsT = 1;
      UI.bark('Bu anası. Kuzu başka yerde.', 'Tamar', 2.6, true);
    }
  },
  draw(g) { KW.draw(g); },
  exit() { KW.indicators = null; KW.lambWallConfuse = null; KW.rimTargets = null; KW.camFocus = null; },
  skip() { if (this.done) return; KW.tamar.x = 19.6; KW.tamar.y = -1.3; this.climbed = true; Cam.minY = -7.5; this.rescue(); },
  hint() {
    const t = KW.tamar, sc = this;
    if (sc.done) return null;
    const auto = () => { // Hikâye kipi: baba yukarıyı gösterir, sahne kendiliğinden ilerler; yün yine verilir
      KW.father.dir = 'up'; UI.bark('Yukarıda, çalının içinde!', 'Baba', 2.4);
      Player.enabled = false; sc.busy = true;
      Scripts.run(function* () {
        t.walkTo(KW.map, 20, 1.3); yield until(() => !t.path);
        sc.busy = false; sc.climb(); yield until(() => sc.climbed);
        sc.rescue();
      }, 'scene');
    };
    if (sc.climbed || t.y <= 2.2) return { ctx: 'duvar', onContinue: auto, levels: [
      { text: 'Kuzu duvarın içine giremez ki... Ses nereden geliyor?', think: true },
      { text: 'Basamak taşları ve çalı belli belirsiz parlıyor.', fx: () => { KW.rimBushFX = 12; } },
      { text: 'Başını kaldır, Tamar. Ses yukarıdan geliyor.', who: 'Baba' }] };
    return { ctx: 'once', onContinue: auto, levels: [
      { text: 'Babam "Kuzu ince meler, anası kalın" derdi. İnce olanın peşine düşmeliyim.', think: true },
      { text: 'İnce dalganın göstergesi büyüdü. (Bakış basılıyken izle.)', fx: () => { KW.lambIndicatorBig = true; } },
      { text: 'İnce sesi izle, kızım. Kalın olan anası.', who: 'Baba' }] };
  },
});

// ============================================================
// SAHNE 4 — "Işığın Ardından" (imza bulmaca)
// ============================================================
Scenes.define('isigin_ardindan', {
  title: 'Işığın Ardından',
  enter(arg) {
    if (!(arg && arg.keep && KW.stage === 'kuzu')) KW.ensure('suru');
    KW.stage = 'suru';
    const sc = this, t = KW.tamar, f = KW.father;
    Flock.night = true;
    KW.sheep.forEach((s) => { s.mode = 'idle'; s.gathered = false; s.evalId = -1; s.inFold = false; });
    f.carry = 'lamb'; f.stone = 'T2'; f.sitting = true; f.standing = false; f.lamp = { ground: true, raised: false };
    f.x = STONES.T2.x + 0.7; f.y = STONES.T2.y; f.dir = 'down';
    Flock.lamp = null; Flock.lampId++;
    Audio.setAmbience({ wind: 0.14, crickets: true });
    sc.t = 0; sc.taps = 0; sc.whistles = 0; sc.saidStaff = false; sc.done = false; sc.auto = false; sc.checkT = -1;
    State.stats.gece_islik = 0;
    UI.usta(0, true);
    UI.objective('Sürüyü ağıla indirmeliyiz.');
    KW.indicators = 'flock';
    Player.onStaff = (second) => {
      const r = Flock.staff(t, t.faceDX, t.faceDY, second);
      sc.taps++;
      if (r.dark > 0 && !sc.saidStaff) { sc.saidStaff = true; UI.bark('Beni görmüyorlar ki... Peki neyi görüyorlar?', 'Tamar', 3.4, true); }
      if (sc.taps >= 2 && !f.standing && !f.path) sc.standUp();
    };
    Player.onWhistle = (W) => {
      sc.whistles++; State.stats.gece_islik = sc.whistles; UI.usta(sc.whistles, true);
      Flock.whistle(W, sekiOf(t.y));
    };
    Player.interactables = Object.keys(STONES).map((id) => ({ x: STONES[id].x, y: STONES[id].y, r: 1.5, label: () => 'Baba, buraya! (' + STONES[id].ad + ')', enabled: () => !sc.done && !sc.auto, action: () => sc.call(id) }));
    sc.startDelay = 0.8;
  },
  standUp() {
    const f = KW.father;
    if (f.standing) return;
    f.standing = true; f.sitting = false;
    Scripts.run(function* () {
      yield 0.5;
      f.lamp = { raised: true };
      Flock.lampRaised(STONES[f.stone]);
    }, 'scene');
  },
  call(id) {
    const sc = this, f = KW.father;
    if (f.path) { UI.bark('Yoldayım, kızım.', 'Baba', 1.6); return; }
    if (Flock.units.length) { UI.bark('Bekle kızım, önce gelsinler.', 'Baba', 2); return; }
    if (id === f.stone) {
      if (!f.standing) { UI.bark('Baba, buraya!', 'Tamar', 1.4); sc.standUp(); return; }
      UI.bark('Buradayım, kızım.', 'Baba', 1.8); return;
    }
    const can = fatherCanGo(f, id);
    UI.bark('Baba, buraya!', 'Tamar', 1.2);
    State.stats.cagri++;
    if (!can.ok) {
      // sürü daha yürüyorsa ayrı, kısa bir bekleme cümlesi
      const moving = Flock.sheep.some((s) => s.mode === 'unit' || s.mode === 'seek');
      Scripts.run(function* () { yield 0.9; UI.bark(moving && can.line === 'a' ? 'Bekle kızım, önce gelsinler.' : FATHER_LINES[can.line], 'Baba', 3.4); }, 'bark');
      return;
    }
    f.standing = true; f.sitting = false;
    Flock.lampLowered();
    f.lamp = { raised: false };
    const S = STONES[id];
    f.speed = 2.5;
    f.walkTo(KW.map, S.x + 0.7, S.y, () => {
      f.stone = id; f.dir = 'down';
      Scripts.run(function* () {
        yield 0.4;
        f.lamp = { raised: true };
        Flock.lampRaised(S);
        sc.checkT = 3;
      }, 'scene');
    });
  },
  update(dt) {
    const sc = this, f = KW.father, t = KW.tamar;
    KW.update(dt); Player.update(dt);
    if (sc.done) return;
    sc.t += dt;
    if (!f.standing && !f.path && sc.t > 40) sc.standUp();
    if (sc.startDelay > 0) { sc.startDelay -= dt; if (sc.startDelay <= 0) UI.prompt('bakis', 'Bakış: karanlıktaki koyunların sesleri'); }
    // 3 sn içinde hiçbir koyun yürümezse
    if (sc.checkT > 0) {
      sc.checkT -= dt;
      if (sc.checkT <= 0) {
        const S = STONES[f.stone];
        const all = Flock.sheep.every((s) => s.gathered && s.gatherAt && dist(s.gatherAt.x, s.gatherAt.y, S.x, S.y) < 0.01);
        if (!Flock.movedSinceRaise && !all) UI.bark(FATHER_LINES.ulasmiyor, 'Baba', 3);
      }
    }
    // bitiş: sürü birimi Kapı'da (T8)
    const K = STONES.T8;
    if (f.stone === 'T8' && !f.path && Flock.sheep.every((s) => s.gathered && !s.stuck && s.gatherAt && dist(s.gatherAt.x, s.gatherAt.y, K.x, K.y) < 0.01 && dist(s.x, s.y, K.x, K.y) < 3.4)) {
      sc.done = true;
      State.flags.usta_b01_iki_islik = !sc.auto && sc.whistles <= 2;
      UI.prompt(null); UI.objective(null);
      Audio.chime();
      Scripts.run(function* () { yield 1.2; Scenes.goto('agil_basinda', { arg: { keep: true } }); }, 'scene');
    }
  },
  draw(g) { KW.draw(g); },
  exit() { KW.indicators = null; },
  skip() { // test kısayolu: sürü kapıda toplanmış sayılır
    const f = KW.father, K = STONES.T8;
    Scripts.kill('scene'); Flock.units = [];
    f.path = null; f.x = K.x + 0.7; f.y = K.y; f.stone = 'T8'; f.standing = true; f.lamp = { raised: true };
    Flock.lampRaised(K);
    Flock.sheep.forEach((s, i) => { const a = (i / 11) * 6.28; s.x = K.x + Math.cos(a) * 1.8; s.y = K.y - 0.3 + Math.sin(a) * 1.1; s.gathered = true; s.stuck = false; s.gatherAt = { x: K.x, y: K.y }; s.mode = 'arrive'; s.goal = null; });
    KW.tamar.x = 8; KW.tamar.y = 31.5;
  },
  // "Babam halleder": baba zinciri kendisi yürür (Hikâye kipi)
  autoSolve() {
    const sc = this, t = KW.tamar, f = KW.father;
    sc.auto = true; Player.enabled = false;
    const gatheredAt = (id) => { const S = STONES[id]; return Flock.sheep.every((s) => s.gathered && !s.stuck && s.gatherAt && dist(s.gatherAt.x, s.gatherAt.y, S.x, S.y) < 0.01); };
    const go = function* (id) {
      if (f.stone !== id) {
        Flock.lampLowered(); f.lamp = { raised: false }; const S = STONES[id];
        f.walkTo(KW.map, S.x + 0.7, S.y, () => { f.stone = id; });
        yield until(() => !f.path && f.stone === id);
        yield 0.3; f.lamp = { raised: true }; Flock.lampRaised(S);
      }
      t.walkTo(KW.map, STONES[id].x - 1.2, STONES[id].y + 1.2);
      yield until(() => gatheredAt(id) && !Flock.units.length);
      yield 0.4;
    };
    Scripts.run(function* () {
      UI.bark('Babam halleder.', 'Tamar', 2, true);
      // sürü bir taşta toplanmamışsa önce babanın taşında topla
      if (!f.standing) { sc.standUp(); yield 1; }
      Flock.units = [];
      const loose = Flock.sheep.filter((s) => !(s.gathered && !s.stuck));
      if (loose.length) {
        // takılmış ya da karanlıkta kalan koyunlar kendi sekilerinin geçide bakan taşına
        const seki = sekiOf(loose[0].y);
        const face = seki <= 1 ? 'T2' : seki === 2 ? 'T5' : seki === 3 ? 'T7' : 'T8';
        if (seki <= 1) {
          if (f.stone !== 'T2' || !(f.lamp && f.lamp.raised)) yield* go('T2');
          if (Flock.sheep.some((s) => sekiOf(s.y) === 1 && !Flock.inLight(s))) {
            t.walkTo(KW.map, 21, 7); yield until(() => !t.path);
            Audio.whistle(t.x); Flock.whistle({ x: t.x, y: t.y }, 1);
          }
          yield until(() => gatheredAt('T2'));
        } else {
          Flock.sheep.forEach((s) => { if (!(s.gathered && !s.stuck)) { s.gathered = false; s.stuck = false; s.mode = 'idle'; s.evalId = -1; } });
          yield* go(face);
        }
      }
      const chain = ['T2', 'T1', 'T3', 'T5', 'T6', 'T7', 'T8'];
      const cur = chain.indexOf(f.stone);
      for (let i = Math.max(1, cur + 1); i < chain.length; i++) yield* go(chain[i]);
    }, 'scene');
  },
  hint() {
    const f = KW.father, sc = this;
    if (sc.done) return null;
    const cont = () => sc.autoSolve();
    const s1dark = Flock.sheep.some((s) => sekiOf(s.y) <= 1 && !s.gathered && !Flock.inLight(s));
    const stuck = Flock.sheep.some((s) => s.stuck) || (f.lamp && f.lamp.raised && Flock.sheep.some((s) => s.gathered && s.gatherAt && dist(s.gatherAt.x, s.gatherAt.y, STONES[f.stone].x, STONES[f.stone].y) > 0.01 && dist(s.x, s.y, STONES[f.stone].x, STONES[f.stone].y) > RING));
    if (!f.standing) return { ctx: 'isik', onContinue: cont, levels: [
      { text: 'Karanlıkta değneğimi görmüyorlar. Peki neye bakıyorlar?', think: true },
      { text: 'Kandil halkası ve durak taşları parlıyor.', fx: () => { KW.showRingFX = 10; KW.showStonesFX = 10; } },
      { text: 'Ben ışığı taşırım, sen yerini seç. Hangi taşın başında durayım?', who: 'Baba' }] };
    if (s1dark) return { ctx: 'k2k3', onContinue: cont, levels: [
      { text: 'Işık onlara uzak. Sesim ışıktan daha uzağa gider.', think: true },
      { text: 'Islık menzili ve tek ıslıklık bölgenin çekirdeği (x = 21, y 5–9) yerde belirdi.', fx: () => { KW.showZoneFX = 14; KW.showRingFX = 14; } },
      { text: 'İkisinin arasına geç ama babamın ışığından çıkma; oradan ıslık çal.', who: 'Yoaş' }] };
    // sürünün durumu: takıldı / karanlıkta / ilerliyor — geçide bakan taş ya da karşı taş
    const g0 = Flock.sheep.find((s) => s.gathered && s.gatherAt);
    const C = g0 ? g0.gatherAt : STONES[f.stone];
    const seki = sekiOf(C.y);
    const facing = { 1: 'T1', 2: 'T5', 3: 'T7' }[seki] || 'T8';
    const across = { T1: 'T3', T5: 'T6', T7: 'T8' }[facing];
    const atFacing = dist(C.x, C.y, STONES[facing].x, STONES[facing].y) < 0.05;
    const target = atFacing ? across : facing;
    return { ctx: stuck ? 'duvar' : 'ilerle', onContinue: cont, levels: [
      { text: 'Işığı görüyorlar ama duvarı aşamıyorlar. Işık geçidin tam karşısında olmalı.', think: true },
      { text: 'Geçitler ve sürünün sekisindeki geçide bakan taş parlıyor.', fx: () => { KW.showGapsFX = 12; KW.showStonesFX = 12; } },
      { text: target ? (STONES[target].ad + '\'na çağır beni, kızım.').replace("Kapı'na", 'Kapıya').replace("taşı'na", 'taşına') : 'Kapıya çağır beni.', who: 'Baba' }] };
  },
});

// ============================================================
// SAHNE 5 — Ağıl başında: değneğin altından sayım, ateş, sapan, "Otur"
// ============================================================
Scenes.define('agil_basinda', {
  title: 'Ağıl başında',
  enter(arg) {
    if (!(arg && arg.keep && KW.stage === 'suru')) KW.ensure('agil');
    KW.stage = 'agil';
    const sc = this, t = KW.tamar, f = KW.father;
    Cam.minY = null;
    sc.counted = false; sc.ready = false; sc.sat = false;
    Player.enabled = false; Player.allowGut = false;
    Audio.setAmbience({ wind: 0.1, crickets: true });
    Player.interactables = [
      { x: 6.6, y: 33.2, r: 1.4, label: 'Çalı demetine bak', enabled: () => sc.ready && !State.flags.kol_b01_sapan, action: () => { State.flags.kol_b01_sapan = true; Audio.rustle(6.6); UI.bark('Sapanım! Akşam burada bırakmışım. Belime taktım.', 'Tamar', 3, true); } },
      { x: FIRE.x - 0.9, y: FIRE.y + 0.6, r: 1.5, label: 'Otur', enabled: () => sc.ready && !sc.sat, action: () => sc.sit() },
    ];
    Scripts.run(function* () {
      yield 0.6;
      // baba kapıya geçer, sürü "değneğin altından" girer
      Flock.lampLowered(); f.lamp = { raised: true };
      t.walkTo(KW.map, 8.4, 32.2);
      f.walkTo(KW.map, 5.9, 33.7); yield until(() => !f.path);
      f.dir = 'left';
      KW.camFocus = { x: 6, y: 32.5 };
      const order = Flock.sheep.slice().sort((a, b) => dist(a.x, a.y, 5, 34) - dist(b.x, b.y, 5, 34));
      for (let i = 0; i < order.length; i++) {
        const s = order[i];
        s.mode = 'tofold'; s.speed = 1.6; s.gathered = false;
        s.goal = { x: 5, y: 33.4 };
        yield until(() => !s.goal);
        f.staffT = 0.2;
        s.goal = { x: 5, y: 35 }; s.onArrive = (q) => { q.inFold = true; q.mode = 'tofold'; q.goal = { x: 1.6 + (q.id % 4) * 1.9 + Math.random() * 0.6, y: 35.1 + (Math.floor(q.id / 4) % 2) * 0.8 + Math.random() * 0.3 }; q.speed = 0.8; q.onArrive = (qq) => { qq.mode = 'idle'; }; };
        UI.bark(NUM[i][0].toUpperCase() + NUM[i].slice(1) + (i === 10 ? '.' : '...'), 'Baba', 1.4);
        Audio.step(5, true);
        yield 0.55;
      }
      yield 1.2;
      KW.gateClosed = true;
      KW.camFocus = { x: 9, y: 32 };
      // Nahum ateşi yakar
      KW.nahum.walkTo(KW.map, FIRE.x + 1.1, FIRE.y + 0.3); yield until(() => !KW.nahum.path);
      KW.nahum.dir = 'left'; yield 0.8;
      KW.fireLit = true; Audio.setAmbience({ wind: 0.1, crickets: true, fire: true });
      KW.yoas.walkTo(KW.map, FIRE.x - 0.4, FIRE.y - 1.0);
      // baba kuzunun bacağını sarar
      f.walkTo(KW.map, FIRE.x + 0.7, FIRE.y - 0.9); yield until(() => !f.path);
      f.lamp = null; f.dir = 'down';
      yield 0.6;
      yield UI.say([SAY.baba('RAB çobanımdır, eksiğim olmaz.', { kind: 'verse', ref: 'Mezmur 23:1 · [yakın aktarım] · mırıldanarak, kuzunun bacağını sararken' })]);
      Audio.kaval();
      KW.camFocus = null;
      sc.ready = true; Player.enabled = true;
      UI.objective('Ateşin başına oturmalıyım.');
    }, 'scene');
  },
  sit() {
    const sc = this, t = KW.tamar;
    sc.sat = true; Player.enabled = false; UI.objective(null);
    Scripts.run(function* () {
      t.goStraight(FIRE.x - 0.9, FIRE.y + 0.7); yield until(() => !t.path);
      t.dir = 'up'; yield 0.6;
      Scenes.goto('mujde', { fadeOut: 1.4, fadeIn: 0.1 });
    }, 'scene');
  },
  update(dt) { KW.update(dt); Player.update(dt); },
  draw(g) { KW.draw(g); },

Scenes.define('haydi_beytlehem', {
  title: 'Haydi Beytlehem\'e',
  enter() {
    KW.ensure('haydi');
    const sc = this, t = KW.tamar, f = KW.father, L = KW.lamb;
    KW.gateClosed = false;
    Audio.setAmbience({ wind: 0.08, crickets: true, fire: true });
    Audio.setDrone(false);
    sc.phase = 0; sc.idle = 0; sc.result = null;
    Player.enabled = false; Player.allowGut = true;
    f.dir = 'left'; KW.nahum.dir = 'left'; KW.yoas.dir = 'down';
    Player.onWhistle = (W) => { if (sc.phase === 1 && L.mode !== 'carried' && dist(L.x, L.y, W.x, W.y) < 8) { L.goal = { x: W.x + 0.8, y: W.y + 0.5 }; L.speed = 0.9; sc.herded = true; } };
    Player.onStaff = () => { if (sc.phase === 1 && L.mode !== 'carried' && dist(L.x, L.y, t.x, t.y) < 4) { const d = dist(L.x, L.y, t.x, t.y) || 1; L.goal = { x: L.x + ((L.x - t.x) / d) * 2.5, y: L.y + ((L.y - t.y) / d) * 2.5 }; if (KW.map.solidAt(L.goal.x, L.goal.y)) L.goal = null; sc.herded = true; } };
    Player.interactables = [
      { get x() { return L.x; }, get y() { return L.y; }, r: 1.4, label: 'Kuzuyu kucağına al', enabled: () => sc.phase === 1 && L.mode !== 'carried' && !L.inFold, action: () => { L.mode = 'carried'; L.visible = false; t.carry = 'lamb'; L.goal = null; KW.lambBleat(0.2); } },
    ];
    Scripts.run(function* () {
      yield 1.2;
      yield UI.say([{ who: 'Çobanlar', text: 'Haydi, Beytlehem\'e kadar gidelim de Rab\'bin bize bildirdiği bu olayı görelim.', kind: 'verse', ref: 'Luka 2:15 · [yakın aktarım; kanonik replik] · baba başlatır, Nahum ile Yoaş birlikte tamamlar' }]);
      yield 2.2; // kısa bir sessizlik
      f.walkTo(KW.map, t.x + 0.9, t.y - 0.3); yield until(() => !f.path);
      f.dir = 'left'; t.dir = 'right';
      yield 0.5;
      f.lamp = null; t.lamp = { child: true };
      yield UI.say([SAY.baba('Önden sen git. Yolu sen aydınlat.')]);
      yield 0.6;
      KW.lambBleat(0.3);
      sc.phase = 1; Player.enabled = true; sc.idle = 0;
      UI.objective('Kuzuyu ağıla koymalıyım.');
    }, 'scene');
  },
  finish(val) {
    const sc = this, t = KW.tamar, L = KW.lamb;
    if (sc.phase !== 1) return;
    sc.phase = 2; Player.enabled = false;
    if (val) State.flags.b01_ifade_kuzu = val;
    UI.objective(null);
    Scripts.run(function* () {
      if (val === 'kucakta') { UI.bark('Kuzu başını Tamar\'ın omzuna koydu.', null, 2.4); yield 1.2; t.carry = null; L.visible = true; L.mode = 'script'; L.x = 5; L.y = 35.2; L.goal = { x: 3.4, y: 35.6 }; yield 1.4; }
      else if (val === 'guderek') { L.faceR = true; KW.lambBleat(0.3); UI.bark('Kuzu ağıl kapısında durup Tamar\'a meledi.', null, 2.6); yield 2; L.goal = { x: 3.4, y: 35.6 }; yield 1; }
      KW.gateClosed = true; Audio.step(5);
      yield 1;
      Scenes.goto('patika');
    }, 'scene');
  },
  update(dt) {
    const sc = this, t = KW.tamar, L = KW.lamb, f = KW.father;
    KW.update(dt); Player.update(dt);
    if (sc.phase !== 1) return;
    const anyInput = Math.abs(Input.axisX) + Math.abs(Input.axisY) > 0.05 || Input.down('gut') || Input.down('interact') || Input.down('bakis');
    sc.idle = anyInput ? 0 : sc.idle + dt;
    // kucakta: ağıla girince bırakır
    if (t.carry === 'lamb' && t.y > 34.4 && Math.abs(t.x - 5) < 4) { sc.finish('kucakta'); return; }
    // ışığı izleyen kuzu: kandilin 5 karoluk halkasında Tamar'a yürür
    if (L.mode !== 'carried') {
      L.mode = 'follow';
      const d = dist(L.x, L.y, t.x, t.y);
      if (d <= 5 && d > 1.3 && !sc.herdT) { L.goal = { x: t.x + (L.x > t.x ? 0.9 : -0.9), y: t.y + 0.4 }; L.speed = 0.85; }
      if (d <= 1.3 && L.goal && !sc.herded) L.goal = null;
      if (sc.herded && L.goal && dist(L.x, L.y, L.goal.x, L.goal.y) < 0.15) sc.herded = false;
      if (L.y > 34.5) { L.inFold = true; sc.finish('guderek'); return; }
    }
    // 20 sn girdi yoksa baba kuzuyu ağıla koyar, değer yazılmaz
    if (sc.idle > 20) {
      sc.phase = 2; Player.enabled = false; UI.objective(null);
      Scripts.run(function* () {
        f.walkTo(KW.map, L.x + 0.6, L.y); yield until(() => !f.path);
        L.visible = false; f.carry = 'lamb';
        f.walkTo(KW.map, 5, 34.8); yield until(() => !f.path);
        f.carry = null; L.visible = true; L.mode = 'script'; L.x = 4.4; L.y = 35.5; L.goal = null;
        KW.gateClosed = true; yield 1;
        Scenes.goto('patika');
      }, 'scene');
    }
  },
  draw(g) { KW.draw(g); },
  exit() { Player.allowGut = true; },
  skip() { if (this.phase === 1) this.finish('kucakta'); else { Scripts.kill('scene'); this.phase = 1; KW.tamar.lamp = { child: true }; KW.father.lamp = null; this.finish('kucakta'); } },
  hint() {
    if (this.phase !== 1) return null;
    return { ctx: 'kuzu', levels: [{ text: 'Kuzu topallıyor. Onu ağıla koymalıyım: kucağıma alabilirim ya da ışığımla götürebilirim.', think: true }, { text: 'Kuzunun yanında Etkileşim: kucağına al. Ağıl kapısı (aşağıda, batıda) açık.' }, { text: 'Kuzuyu ağıla koy, kızım; sonra yola düşeriz.', who: 'Baba', onContinue: () => this.finish(null) }] };
  },
});

// ---------- ortak: izleyiciler (çobanlar Tamar'ın izinden yürür) ----------
const Trail = {
  pts: [], reset(x, y) { this.pts = [{ x, y }]; },
  push(x, y) { const l = this.pts[this.pts.length - 1]; if (dist(l.x, l.y, x, y) > 0.15) { this.pts.push({ x, y }); if (this.pts.length > 400) this.pts.shift(); } },
  at(back) { // izden "back" karo geride kalan nokta
    let acc = 0;
    for (let i = this.pts.length - 1; i > 0; i--) {
      const a = this.pts[i], b = this.pts[i - 1], d = dist(a.x, a.y, b.x, b.y);
      if (acc + d >= back) { const k = (back - acc) / d; return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) }; }
      acc += d;
    }
    return this.pts[0];
  },
};
function updateFollowers(list, dt, gaps) {
  list.forEach((a, i) => {
    const p = Trail.at(gaps[i]);
    const d = dist(a.x, a.y, p.x, p.y);
    if (d > 0.12) { const sp = Math.min(d * 2.2, 3.2) * dt; a.x += ((p.x - a.x) / d) * Math.min(sp, d); a.y += ((p.y - a.y) / d) * Math.min(sp, d); a.face(p.x - a.x, p.y - a.y); a.speed = 2.2; a.setMoving(true, dt); }
    else a.setMoving(false, dt);
  });
}

// ---------- Patika haritası ----------
const PATIKA_PTS = [[2, 18], [14, 17.5], [18, 13.5], [30, 12.5], [34, 8.5], [46, 7.5], [50, 4.5], [62, 4.5]];
function buildPatika() {
  const m = new TileMap(64, 22, 0, 0);
  m.fill(0, 0, 63, 21, T.ROUGH); m.fill(0, 0, 63, 1, T.SKY);
  const stamp = (x, y) => {
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const X = Math.round(x + dx), Y = Math.round(y + dy); if (Y < 2 || Y > 20 || X < 0 || X > 63) continue;
      const cur = m.get(X, Y);
      if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) m.set(X, Y, T.PATH); else if (cur === T.ROUGH) m.set(X, Y, T.GRASS);
    }
  };
  for (let i = 0; i < PATIKA_PTS.length - 1; i++) {
    const [ax, ay] = PATIKA_PTS[i], [bx, by] = PATIKA_PTS[i + 1], n = Math.ceil(dist(ax, ay, bx, by) * 3);
    for (let k = 0; k <= n; k++) stamp(lerp(ax, bx, k / n), lerp(ay, by, k / n));
  }
  // basamaklar (eğimli kesimler)
  for (let i = 0; i < PATIKA_PTS.length - 1; i++) {
    const [ax, ay] = PATIKA_PTS[i], [bx, by] = PATIKA_PTS[i + 1];
    if (Math.abs(by - ay) < 2) continue;
    const n = Math.ceil(dist(ax, ay, bx, by) * 2);
    for (let k = 1; k < n; k++) { const X = Math.round(lerp(ax, bx, k / n)), Y = Math.round(lerp(ay, by, k / n)); if (m.get(X, Y) === T.PATH) m.set(X, Y, T.STAIR); }
  }
  paintMap(m, (g, v, x, y, px, py, rr) => {
    if (v === T.STAIR) { paintDirt(g, px, py, rr); g.fillStyle = '#0a0b1a'; g.fillRect(px, py + 5, 16, 2); g.fillRect(px, py + 12, 16, 2); g.fillStyle = '#a49a86'; g.fillRect(px, py + 4, 16, 1); g.fillRect(px, py + 11, 16, 1); return; }
    if (v === T.GRASS) { paintGrass(g, px, py, rr, true); return; }
    paintKirlar(g, v, x, y, px, py, rr);
  });
  const objs = [];
  const rr = makeRng(91);
  for (let i = 0; i < 46; i++) {
    const x = Math.floor(rr() * 64), y = 3 + Math.floor(rr() * 18);
    if (m.get(x, y) !== T.ROUGH) continue;
    const k = rr();
    objs.push({ kind: k < 0.3 ? 'tree' : k < 0.6 ? 'rock' : 'bush', x, y: y + 0.4, spr: k < 0.3 ? (rr() < 0.5 ? ART.trees.olive : ART.trees.olive2) : k < 0.6 ? ART.rocks[Math.floor(rr() * 3)] : ART.bush2 });
  }
  return { map: m, objs };
}

  m.fill(0, 0, 47, 24, T.ROUGH); m.fill(0, 0, 47, 1, T.SKY);
  m.fill(1, 3, 46, 5, T.GRASS);

// kenarları keskinleştirilmiş katman (yumuşatma pikselleri temizlenir)
function crispLayer(w, h, fn) {
  const c = makeCanvas(w, h), g = c.getContext('2d');
  fn(g);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 110 ? 255 : 0;
  g.putImageData(im, 0, 0);
  return c;
}
function ell(g, x, y, rx, ry, col) { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.2832); g.fill(); }
function poly(g, pts, col) { g.fillStyle = col; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); }
function sacredUI(on) {
  $('topbtns').style.opacity = on ? '0' : '';
  $('topbtns').style.pointerEvents = on ? 'none' : '';
  $('touch').style.opacity = on ? '0.35' : '';
}

// Çerçeve: Mecdel, tezgâh başı (giriş ve kapanış ortak çizim)
// ------------------------------------------------------------
const Frame = {
  bg: null, fig: null,
  build() {
    if (this.bg) return;
    this.bg = crispLayer(VW, VH, (g) => {
      g.fillStyle = '#1e1712'; g.fillRect(0, 0, VW, VH);
      // taş duvar
      const rr = makeRng(4);
      for (let y = 0; y < 300; y += 9) for (let x = (y / 9) % 2 ? -10 : 0; x < VW; x += 22) { g.fillStyle = ['#2a2018', '#251c15', '#30251b'][Math.floor(rr() * 3)]; g.fillRect(x + 1, y + 1, 20, 7); }
      // pencere (gök)
      g.fillStyle = '#0d0a08'; g.fillRect(452, 52, 112, 88);
      g.clearRect(458, 58, 100, 76);
      // raf ve kandil yeri
      g.fillStyle = '#3a2a1c'; g.fillRect(70, 132, 70, 6); g.fillStyle = '#4a3624'; g.fillRect(70, 132, 70, 2);
      // zemin
      g.fillStyle = '#2c2218'; g.fillRect(0, 300, VW, 60); g.fillStyle = '#3a2c1e'; for (let x = 0; x < VW; x += 13) g.fillRect(x, 300 + ((x * 7) % 11), 6, 1);
      // dikey dokuma tezgâhı (ağırlıklı)
      g.fillStyle = '#4a3420'; g.fillRect(250, 70, 8, 232); g.fillRect(420, 70, 8, 232); g.fillRect(244, 64, 190, 10);
      g.fillStyle = '#5e4428'; g.fillRect(250, 70, 2, 232); g.fillRect(244, 64, 190, 2);
      // dokunmuş kumaş (önceki bantlar)
      g.fillStyle = '#3c2e48'; g.fillRect(262, 76, 154, 70);
      for (let y = 80; y < 144; y += 12) { g.fillStyle = y % 24 ? '#5a4a6a' : '#6a3a2e'; g.fillRect(262, y, 154, 3); }
      // çözgü iplikleri ve ağırlıklar
      for (let x = 264; x < 416; x += 4) { g.fillStyle = '#b8a98a'; g.fillRect(x, 146, 1, 120); }
      for (let x = 266; x < 414; x += 12) { ell(g, x, 272, 4, 5, '#6a5a48'); ell(g, x, 271, 3, 3, '#7e6c56'); }
    });
    this.figs = crispLayer(VW, VH, (g) => {
      // yaşlı Tamar (yan profil, tezgâhın solunda ayakta)
      poly(g, [212, 300, 206, 220, 214, 178, 230, 170, 242, 180, 246, 224, 244, 300], '#2e3a6a');
      poly(g, [214, 180, 222, 160, 238, 158, 246, 172, 244, 196, 230, 190], '#cfc3a6');
      ell(g, 236, 176, 7, 8, '#b48c6c');
      poly(g, [224, 166, 232, 154, 246, 160, 246, 176, 238, 168], '#d9ceb4');
      poly(g, [240, 196, 262, 200, 266, 206, 244, 208], '#2e3a6a');
      g.fillStyle = '#b48c6c'; g.fillRect(262, 200, 6, 5);
      // Sara (yerde oturan çocuk)
      poly(g, [130, 300, 132, 262, 146, 252, 160, 262, 166, 300], '#6a5236');
      ell(g, 148, 244, 9, 10, '#2e1c14');
      ell(g, 150, 247, 6, 7, '#d8b090');
      poly(g, [160, 276, 186, 286, 186, 292, 160, 288], '#6a5236');
    });
  },
  draw(g, o) {
    this.build();
    o = o || {};
    // pencereden gök
    g.fillStyle = '#05061a'; g.fillRect(0, 0, VW, VH);
    g.save(); g.beginPath(); g.rect(458, 58, 100, 76); g.clip();
    Gfx.drawSky(g, 0, -40, { dim: 1, dipperGlow: o.dipper || 0 });
    g.restore();
    g.drawImage(this.bg, 0, 0);
    if (o.band) o.band(g);
    g.drawImage(this.figs, 0, 0);
    // raf kandili
    g.drawImage(ART.lamp, 100, 128); g.drawImage(ART.flame[Math.floor(State.time * 8) % 3], 102, 124);
    Gfx.resetLights();
    Gfx.light(104, 126, 160, 1); Gfx.glow(104, 126, 64, 0.45);
    Gfx.light(508, 96, 60, 0.6);
    Gfx.applyDark('#05040a', 0.62);
  },
};

    sc.camY = 280; sc.camTarget = 280; sc.flood = 0; sc.floodT = 0; sc.angel = 0; sc.host = []; sc.hostA = 0; sc.stars = 1; sc.dark = 0.8; sc.cine = 0;
    sc.lookPrompt = false; sc.looked = false; sc.huddle = 0; sc.bury = false;
    sacredUI(true);
    Audio.setDrone(false); Audio.setAmbience({ wind: 0.04, crickets: false, fire: true });
    if (!sc.ground) sc.buildArt();
    const rr = makeRng(9);
    for (let i = 0; i < 46; i++) sc.host.push({ x: 40 + rr() * 560, y: 110 + rr() * 260, tx: 320 + (rr() - 0.5) * 300, ty: 330 + (rr() - 0.5) * 150, s: rr() < 0.25 ? 2 : 1, ph: rr() * 6.28 });
    // sürü ağılda bir köşeye sıkışır
    sc.sheep = []; for (let i = 0; i < 11; i++) sc.sheep.push({ x: 70 + (i % 6) * 15 + (i > 5 ? 7 : 0), y: 552 + Math.floor(i / 6) * 8, tx: 52 + (i % 4) * 10, ty: 548 + Math.floor(i / 4) * 6 });

      sc.cine = 0;
      yield (dt) => { sc.cine = Math.min(1, sc.cine + dt); return sc.cine >= 1; };
      Audio.setTone(true, 196, 0.06); Audio.cluster(true);
      yield (dt) => { sc.floodT += dt; sc.flood = smooth(Math.min(1, sc.floodT / 1.6)) * 0.72; sc.dark = Math.max(0.12, 0.8 - sc.floodT * 0.6); sc.stars = Math.max(0.25, 1 - sc.floodT * 0.6); sc.angel = Math.min(1, sc.floodT / 1.6); return sc.floodT >= 1.6; };
      sc.bury = true;
      yield (dt) => { sc.flood = Math.max(0.3, sc.flood - dt * 0.25); sc.huddle = Math.min(1, sc.huddle + dt * 0.6); return sc.flood <= 0.3; };
      yield 0.6;
      yield UI.say([{ who: 'Rab\'bin meleği', text: 'Korkmayın! İşte size bütün halkı çok sevindirecek bir müjde getiriyorum. Bugün Davut\'un kentinde sizin için bir Kurtarıcı doğdu. O, Rab Mesih\'tir. Size şu işaret olacak: Kundağa sarılmış, yemlikte yatan bir bebek bulacaksınız.', kind: 'verse', ref: 'Luka 2:10–12 · [yakın aktarım; kanonik replik]', auto: 7, lock: true }]);
      // 2:13 — gök ordusu
      Audio.rise();
      yield (dt) => { sc.hostA = Math.min(1, sc.hostA + dt * 0.35); return sc.hostA >= 1; };
      sc.lookPrompt = true; UI.prompt('look', 'başını kaldır');
      let waited = 0;
      yield (dt) => { waited += dt; const up = Input.down('up') || Input.down('lookup') || (Input.down('bakis') && Input.down('up')); if (up) sc.looked = true; return sc.looked || waited >= 8; };
      sc.lookPrompt = false; UI.prompt(null);
      if (sc.looked) sc.camTarget = 40;
      yield 1.8;
      yield UI.say([{ who: 'Gök ordusu', text: 'En yücelerde Tanrı\'ya yücelik olsun! Yeryüzünde O\'nun hoşnut kaldığı insanlara esenlik olsun!', kind: 'verse', ref: 'Luka 2:14 · [yakın aktarım; kanonik replik]', auto: 6, lock: true }]);
      // 2:15'in başı: bütün ışıklar tamamen söner, gerçek yıldızlar kalır
      Audio.cluster(false); Audio.setTone(false);
      yield (dt) => { sc.hostA = Math.max(0, sc.hostA - dt * 0.9); sc.angel = Math.max(0, sc.angel - dt * 0.9); sc.flood = Math.max(0, sc.flood - dt * 0.6); sc.dark = Math.min(0.8, sc.dark + dt * 0.7); sc.stars = Math.min(1, sc.stars + dt * 0.7); return sc.hostA <= 0 && sc.angel <= 0 && sc.dark >= 0.8; };
      yield UI.say([{ text: 'Melekler onların yanından göğe dönünce...', kind: 'narr', ref: 'Luka 2:15 · [yakın aktarım]', auto: 2.5, lock: true }]);
      sc.camTarget = 280;

  },
  buildArt() {
    const sc = this;
    sc.ground = crispLayer(VW, 640, (g) => {
      poly(g, [0, 440, 90, 422, 190, 432, 300, 414, 420, 428, 520, 410, 640, 424, 640, 640, 0, 640], '#0c1028');
      poly(g, [0, 470, 140, 456, 260, 466, 380, 452, 520, 464, 640, 452, 640, 640, 0, 640], '#121a2a');
      for (let k = 0; k < 3; k++) { g.fillStyle = '#1e2634'; g.fillRect(0, 486 + k * 22, 640, 3); g.fillStyle = '#2a3240'; g.fillRect(0, 486 + k * 22, 640, 1); }
      poly(g, [0, 540, 640, 530, 640, 640, 0, 640], '#26302a');
      // ağıl duvarı (solda)
      g.fillStyle = '#4a463e'; g.fillRect(30, 560, 150, 8); g.fillRect(30, 540, 8, 28); g.fillRect(172, 540, 8, 28);
      g.fillStyle = '#6a6458'; for (let x = 30; x < 180; x += 7) g.fillRect(x, 560, 5, 2);
      g.fillStyle = '#0a0a10'; g.fillRect(38, 532, 134, 10);
    });
  },
  update(dt) {
    const sc = this;
    sc.camY = approach(sc.camY, sc.camTarget, dt * (REDUCED ? 400 : 120));
    for (const s of sc.sheep) { s.x = lerp(s.x, s.tx, Math.min(1, dt * sc.huddle * 1.2)); s.y = lerp(s.y, s.ty, Math.min(1, dt * sc.huddle * 1.2)); }
    for (const h of sc.host) { h.x += (h.tx - h.x) * dt * 0.05; h.y += (h.ty - h.y) * dt * 0.05; }
    Gfx.updateParticles(dt);
    if (Math.random() < dt * 10) Gfx.spawn({ x: 320 + (Math.random() - 0.5) * 6, y: 598, vx: (Math.random() - 0.5) * 5, vy: -12, t: 0, life: 0.9, c: '#ffcf7a' });
  },
  draw(g) {

    g.drawImage(sc.ground, 0, -cy);
    // ağıldaki koyunlar
    for (const s of sc.sheep) g.drawImage(ART.sheep.a, Math.round(s.x) - 8, Math.round(s.y - cy) - 12);
    // ateş
    const fx = 320, fy = 600 - cy;
    g.fillStyle = '#4a3020'; g.fillRect(fx - 5, fy - 2, 10, 3);
    for (let i = 0; i < 7; i++) { const h = 3 + ((Math.sin(State.time * 9 + i * 1.7) + 1) * 3) | 0; g.fillStyle = '#e06a2a'; g.fillRect(fx - 3 + i, fy - 2 - h, 1, h); g.fillStyle = '#ffd27a'; g.fillRect(fx - 2 + (i % 5), fy - 3, 1, 1); }
    // çobanlar sırttan (kompozisyon çobanların sırtından kurulur)
    const base = 612 - cy;
    const sb = ART.sitBack;
    g.drawImage(sb.yoas, 262 - 8, base - 30);
    g.drawImage(sb.baba, 296 - 8, base - 30);
    g.drawImage(sb.nahum, 352 - 8, base - 30);
    if (sc.bury) g.drawImage(ART.tamarCrouch, 285 - 8, base - 22 + 2); // Tamar yüzünü babasının abasına gömer
    else g.drawImage(ART.tamar.up[0], 280 - 8, base - 22);
    // melek: dikey ışık biçimi (insan boyunu biraz aşar: ~44 px)
    const ax = 320, ay = 560 - cy;
    if (sc.angel > 0) {
      const a = sc.angel;
      for (let y = 0; y < 46; y++) {
        const t = y / 46, w = Math.round(3 + Math.sin(t * Math.PI) * 6 + (t > 0.85 ? -2 : 0));
        g.globalAlpha = a * (0.55 + 0.45 * Math.sin(t * Math.PI));
        g.fillStyle = '#fff4cc'; g.fillRect(ax - w, ay - 46 + y, w * 2, 1);
        g.globalAlpha = a; g.fillStyle = '#ffffff'; g.fillRect(ax - Math.max(1, w - 4), ay - 46 + y, Math.max(2, (w - 4) * 2), 1);
      }
      g.globalAlpha = 1;
    }
    // gök ordusu: titreşmeyen, yavaş hareket eden beyaz-altın ışıklar (yıldızlardan ayrı)
    if (sc.hostA > 0) {
      for (const h of sc.host) {
        const x = Math.round(h.x), y = Math.round(h.y - cy);
        if (y < -4 || y > VH + 4) continue;
        g.globalAlpha = sc.hostA; g.fillStyle = '#fff4cc'; g.fillRect(x, y - 1, 1, 3 + h.s); g.fillRect(x - 1, y, 3, 1 + h.s);
        g.globalAlpha = sc.hostA * 0.35; g.fillRect(x - 1, y - 2, 3, 5 + h.s);
      }
      g.globalAlpha = 1;
    }

    // ışık katmanı

    Gfx.light(fx, fy - 4, 90, 0.9); Gfx.glow(fx, fy - 4, 40, 0.4);
    if (sc.angel > 0) { Gfx.light(ax, ay - 24, 160, sc.angel); Gfx.glow(ax, ay - 24, 64, 0.8 * sc.angel, ART.glow.gold); }
    Gfx.applyDark('#03040f', sc.dark);
    if (sc.flood > 0) { g.globalCompositeOperation = 'lighter'; const f = Math.min(1, sc.flood * 1.25); g.fillStyle = `rgb(${Math.round(255 * f)},${Math.round(226 * f)},${Math.round(150 * f)})`; g.fillRect(0, 0, VW, VH); g.globalCompositeOperation = 'source-over'; }
    Gfx.cinema(sc.cine);
  },
  exit() { sacredUI(false); Audio.cluster(false); Audio.setTone(false); },
  skip() { Scripts.kill('scene'); UI.dlg.active = false; $('dialog').classList.add('hidden'); Scenes.goto('haydi_beytlehem', { fadeOut: 0.3 }); },
});

        poly(g, [138, 270, 140, 250, 148, 240, 158, 248, 162, 270], INK); ell(g, 150, 236, 6, 7, INK);
        ell(g, 158, 254, 5, 4, INK);
        poly(g, [86, 300, 88, 254, 96, 244, 106, 254, 108, 300], INK); ell(g, 97, 238, 6, 7, INK); g.fillRect(110, 236, 2, 64); // Yusuf ve değnek
        // orta: uzakta yas tutan kadınlar (asker ve şiddet yok)
        const w = (x, h, bend) => { poly(g, [x - 7, 300, x - 5, 300 - h * 0.75 + bend, x, 300 - h * 0.9 + bend, x + 6, 300 - h * 0.75 + bend, x + 8, 300], 'rgba(42,26,16,0.7)'); ell(g, x + bend * 0.3, 300 - h + bend, 4.5, 5.5, 'rgba(42,26,16,0.7)'); };
        w(560, 44, 6); w(582, 46, 2); w(600, 42, 8); w(622, 45, 4); w(648, 43, 7); w(668, 40, 3);
        // sağ: kuzeye kaçan Tamar'ın ailesi; babanın sırtında postun içinde Natan, Tamar'ın elinde kandil
        poly(g, [1010, 300, 1012, 252, 1022, 240, 1034, 250, 1036, 300], INK); ell(g, 1024, 234, 6.5, 7.5, INK);
        ell(g, 1010, 256, 9, 11, INK); // sırttaki post
        poly(g, [1050, 300, 1052, 258, 1060, 248, 1070, 258, 1072, 300], INK); ell(g, 1061, 242, 6, 7, INK); // anne
        poly(g, [1086, 300, 1087, 276, 1092, 268, 1100, 276, 1101, 300], INK); ell(g, 1094, 263, 5, 6, INK); // çocuk Tamar
      });
    }
    sc.x = 0; sc.verse = false;
    UI.objective('Tablo · Matta 2:13–18 · tanıklık iddiası yok');
    Audio.setDrone(false); Audio.setAmbience({ wind: 0.12 });
    Scripts.run(function* () {
      yield 1.0;
      Audio.march();
      yield (dt) => { sc.x = Math.min(320, sc.x + dt * 40); return sc.x >= 320; };
      Audio.lament();
      yield UI.say([{ text: 'Rama\'da bir ses duyuldu, ağlayış ve acı feryat. Rahel çocukları için ağlıyor, avutulmak istemiyor; çünkü onlar artık yok.', kind: 'verse', ref: 'Matta 2:18 (Yeremya 31:15) · [yakın aktarım]' }]);
      yield (dt) => { sc.x = Math.min(640, sc.x + dt * 40); return sc.x >= 640; };
      yield 0.8;
      yield UI.say([SAY.yasli('Melekler Tanrı\'yı övdü, sonra askerler geldi.')]);
      yield 1.2;
      Scenes.goto('cerceve_kapanis', { fadeOut: 1.2 });

  },
  update() {},
  draw(g) {
    const x = Math.round(this.x);
    g.drawImage(this.par, x, 0, VW, VH, 0, 0, VW, VH);
    g.drawImage(this.art, x, 0, VW, VH, 0, 0, VW, VH);
    // Tamar'ın elindeki kandil (tek sıcak nokta)
    const lx = 1104 - x, ly = 282;
    if (lx > -10 && lx < VW + 10) { g.fillStyle = '#f0a040'; g.fillRect(lx, ly, 3, 2); g.fillStyle = '#fff0b0'; g.fillRect(lx + 1, ly - 2, 1, 2); }
  },

});

// ------------------------------------------------------------
// SAHNE 15 — Çerçeve kapanışı: dokuma bandı
// Renk: bölümün teması (çivit, yıldız altını, kandil turuncusu)
// Desen: koye → dalgalı · babaya → ortası düzleşen dalga · kalbinde → düz (GDD §8.7; bölüm §8.1)
// ------------------------------------------------------------
function drawBand(g, x0, y0, w, h, rows, haber) {
  const total = h;
  for (let y = 0; y < Math.min(rows, total); y++) {
    for (let x = 0; x < w; x++) {
      let col = '#26305e';
      if (y === 0 || y === total - 1) col = '#f0a040';
      else if (y === 2 || y === total - 3) col = '#9a5a32';
      const mid = (total - 1) / 2;
      let amp = 0;
      if (haber === 'koye') amp = 5;
      else if (haber === 'babaya') amp = 5 * Math.min(1, Math.abs(x - w / 2) / (w * 0.32));
      const wy = mid + Math.sin(x * 0.19) * amp;
      if (Math.abs(y - wy) < 1.1) col = '#e8c66a';
      if (haber === 'kalbinde' && (Math.abs(y - mid) < 0.6 || Math.abs(y - (mid - 4)) < 0.6 || Math.abs(y - (mid + 4)) < 0.6)) col = Math.abs(y - mid) < 0.6 ? '#e8c66a' : '#5a6aa0';
      if ((x + y) % 2 === 0 && col === '#26305e') col = '#2c376a';
      g.fillStyle = col; g.fillRect(x0 + x, y0 + y, 1, 1);
    }
  }
  // bant ucunda kuzu yününden bir düğüm
  if (rows >= total && State.flags.kol_b01_kuzu_yunu) { g.fillStyle = '#0a0b1a'; g.fillRect(x0 + w + 1, y0 + total / 2 - 3, 6, 6); g.fillStyle = '#ece6d4'; g.fillRect(x0 + w + 2, y0 + total / 2 - 2, 4, 4); }
}
Scenes.define('cerceve_kapanis', {
  title: 'Çerçeve kapanışı',
  enter() {
    const sc = this; sc.rows = 0; sc.weave = false;
    const F = State.flags;
    if (!F.b01_haber) F.b01_haber = 'kalbinde';
    Audio.setDrone(true, 110); Audio.setAmbience({ wind: 0.05, crickets: true });
    Scripts.run(function* () {
      yield 1;
      const L = [];
      if (F.b01_haber === 'koye') L.push(SAY.yasli('Şaştılar. Sonra herkes unuttu; ben unutmadım.'));
      if (F.b01_haber === 'kalbinde') L.push(SAY.yasli('Kimseye bir şey demedim. O bebeğin annesi gibi, ben de sakladım. Belki doğrusu buydu, belki değil.'));
      if (F.kol_b01_kuzu_yunu) L.push(SAY.yasli('Dikende bir tutam yün kalmıştı. Annem onu eğirip bileğime bağladı.'));
      if (F.kol_b01_sapan) L.push(SAY.yasli('Sapanımla tek bir kurt bile vurmadım. Ama belimdeyken karanlıktan korkmazdım.'));
      if (F.kol_b01_saman_copu) L.push(SAY.yasli('Bir saman çöpü. Gülme, Sara; o gece hiçbir şey sıradan değildi.'));
      yield UI.say(L);
      sc.weave = true;
      yield until(() => sc.rows >= 24);
      yield 1.6;
      Scenes.goto('son', { fadeOut: 1 });
    }, 'scene');
  },
  update(dt) { if (this.weave) this.rows = Math.min(24, this.rows + dt * 6); },
  draw(g) {
    const sc = this;
    Frame.draw(g, { band: (gg) => drawBand(gg, 268, 148, 142, 24, Math.floor(sc.rows), State.flags.b01_haber) });
    if (sc.weave) {
      // bandın yakın görünümü (önceden çizilmiş, ölçeklenmeden: büyük sürüm ayrıca dokunur)
      g.fillStyle = 'rgba(5,6,15,0.82)'; g.fillRect(140, 256, 360, 72);
      g.strokeStyle = '#6b5a3a'; g.strokeRect(140.5, 256.5, 359, 71);
      drawBandLarge(g, 152, 268, 336, 48, sc.rows / 24, State.flags.b01_haber);
    }
  },
  skip() { Scripts.kill('scene'); Scenes.goto('son', { fadeOut: 0.3 }); },
});
function drawBandLarge(g, x0, y0, w, h, k, haber) {
  // 2 px'lik iplik ızgarası: piksel yoğunluğu korunur (2×2 hücre = tek iplik)
  const cols = Math.floor(w / 2), rows = Math.floor(h / 2), show = Math.floor(rows * k);
  for (let y = 0; y < show; y++) for (let x = 0; x < cols; x++) {
    let col = '#26305e';
    if (y === 0 || y === rows - 1) col = '#f0a040'; else if (y === 2 || y === rows - 3) col = '#9a5a32';
    const mid = (rows - 1) / 2;
    let amp = haber === 'koye' ? 6 : haber === 'babaya' ? 6 * Math.min(1, Math.abs(x - cols / 2) / (cols * 0.32)) : 0;
    const wy = mid + Math.sin(x * 0.16) * amp;
    if (Math.abs(y - wy) < 1.1) col = '#e8c66a';
    if (haber === 'kalbinde') { if (Math.abs(y - mid) < 0.6) col = '#e8c66a'; else if (Math.abs(y - mid) > 4.4 && Math.abs(y - mid) < 5.6) col = '#5a6aa0'; }
    if ((x + y) % 2 === 0 && col === '#26305e') col = '#2c376a';
    g.fillStyle = col; g.fillRect(x0 + x * 2, y0 + y * 2, 2, 2);
  }
}
