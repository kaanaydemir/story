<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Kandil — Yıldızın Altında</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="640" height="360" aria-label="Oyun ekranı"></canvas>
  </div>
  <div id="ui">
    <div id="objective" class="hidden"></div>
    <div id="usta" class="hidden"></div>
    <div id="bark" class="hidden"><span class="who"></span><span class="txt"></span></div>
    <div id="prompt" class="hidden"></div>
    <div id="dialog" class="hidden" role="dialog" aria-live="polite">
      <div class="portrait"><canvas width="24" height="24"></canvas></div>
      <div class="body">
        <div class="speaker"></div>
        <div class="text"></div>
        <div class="verse"></div>
      </div>
      <div class="next">▾</div>
    </div>
    <div id="choices" class="hidden"></div>
    <div id="hintpanel" class="hidden"></div>
    <div id="topbtns">
      <button id="btn-hint" class="tbtn" aria-label="Üç Işık ipucu" title="Üç Işık (H)"><span class="lampicon"></span></button>
      <button id="btn-menu" class="tbtn" aria-label="Menü" title="Menü (Esc)">≡</button>
    </div>
    <div id="card" class="hidden"></div>
    <div id="fade"></div>
    <div id="menu" class="hidden"></div>
  </div>
  <div id="touch" class="hidden">
    <div id="joy"><div id="joy-base"></div><div id="joy-knob"></div></div>
    <div id="tbuttons">
      <button id="tb-bakis" class="tb">Bakış</button>
      <button id="tb-gut" class="tb">Güt</button>
      <button id="tb-etk" class="tb">Etkileşim</button>
    </div>
  </div>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
